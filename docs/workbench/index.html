<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-ydbHi3wih+tBIroJ1RcZq9heKu9O8syZpkmqKXYwrV0='; style-src 'sha256-GKKenHvZMxMgG0hAGzMF5nCfLDhTIYSx5XxaLw6D+Ms='; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'">
<meta name="color-scheme" content="dark">
<title>MARA 安全審查工作台</title>
<style>:root {
  color-scheme: dark;
  --bg: #0b1416;
  --bg-2: #0d181b;
  --side: #0a1214;
  --panel: #101c1f;
  --panel-2: #142427;
  --panel-3: #18292d;
  --border: #1d2e32;
  --border-2: #26393d;
  --text: #dbe7e5;
  --text-2: #b5c7c4;
  --muted: #8aa3a0;
  --accent: #4fd1a5;
  --accent-2: #2dd4bf;
  --accent-ink: #052019;
  --accent-soft: rgba(79, 209, 165, 0.12);
  --accent-line: rgba(79, 209, 165, 0.45);
  --warn: #f5b942;
  --warn-soft: rgba(245, 185, 66, 0.08);
  --warn-line: rgba(245, 185, 66, 0.38);
  --danger: #ef6b62;
  --danger-soft: rgba(224, 86, 79, 0.12);
  --danger-line: rgba(224, 86, 79, 0.45);
  --info: #6cb4ff;
  --info-soft: rgba(90, 169, 255, 0.12);
  --violet: #a78bfa;
  --orange: #fb923c;
  --radius: 12px;
  --radius-sm: 8px;
  --font: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.02) inset, 0 8px 24px rgba(0, 0, 0, 0.25);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: 0.01em; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 14px; height: 14px; }
.icon.lg { width: 26px; height: 26px; }

.skip {
  position: absolute; left: 12px; top: -48px; z-index: 50;
  background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 600;
}
.skip:focus { top: 12px; }

/* ------------------------------------------------------------------ shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  background: var(--side); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 18px; padding: 22px 14px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand .logo { color: var(--accent); width: 30px; height: 30px; }
.brand-name { font-size: 18px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
.brand-sub { font-size: 11.5px; color: var(--muted); letter-spacing: 0.12em; }
.version-chip { font: 600 10.5px var(--mono); color: var(--text-2); border: 1px solid var(--border-2); border-radius: 6px; padding: 1px 6px; }
.ws-label { display: flex; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; padding: 0 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; display: inline-block; }
.dot.warn { background: var(--warn); }
.dot.danger { background: var(--danger); }
.dot.muted { background: var(--muted); }
.dot.info { background: var(--info); }
.dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--text-2);
  border: 1px solid transparent; font-weight: 550;
}
.nav a:hover { background: var(--panel); text-decoration: none; color: var(--text); }
.nav a[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent-line); color: #eafff7; }
.nav .badge {
  margin-left: auto; min-width: 22px; text-align: center; font: 600 11px var(--mono); padding: 1px 6px; border-radius: 6px;
  background: rgba(79, 209, 165, 0.18); color: var(--accent);
}
.side-h { font-size: 11.5px; color: var(--muted); letter-spacing: 0.1em; padding: 0 8px 6px; font-weight: 600; }
.recent { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; }
.recent a { display: block; padding: 8px 10px; border-radius: 8px; color: var(--text-2); }
.recent a:hover { background: var(--panel); text-decoration: none; }
.recent a[aria-current="page"] { background: var(--panel-2); }
.recent .r-title { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent .r-title span:last-child { overflow: hidden; text-overflow: ellipsis; }
.recent .r-sub { font-size: 11px; color: var(--muted); padding-left: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent .empty { padding: 8px 10px; font-size: 12px; color: var(--muted); }
.side-foot { border-top: 1px solid var(--border); padding: 14px 8px 0; display: flex; gap: 10px; color: var(--muted); font-size: 11.5px; }
.side-foot strong { display: block; color: var(--text-2); font-weight: 600; font-size: 12px; }

.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 28px; border-bottom: 1px solid var(--border);
  background: rgba(11, 20, 22, 0.92); position: sticky; top: 0; z-index: 20; backdrop-filter: blur(6px);
}
.crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; min-width: 0; }
.crumbs a { color: var(--muted); }
.crumbs span:last-child { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.svc { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); padding: 0 6px; }
main { padding: 26px 28px 60px; max-width: 1240px; width: 100%; margin: 0 auto; outline: none; }
#banner-area { max-width: 1240px; width: 100%; margin: 0 auto; padding: 18px 28px 0; }
#banner-area:empty { display: none; }

/* ------------------------------------------------------------------ controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9px; padding: 9px 16px;
  border: 1px solid var(--border-2); background: var(--panel); color: var(--text); cursor: pointer; font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--accent-line); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #6ee0b8; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--danger-line); color: var(--danger); background: transparent; }
.btn.small { padding: 5px 11px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-2); cursor: pointer; }
.icon-btn:hover { border-color: var(--border-2); color: var(--text); }
label { display: block; font-weight: 600; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field + .field { margin-top: 14px; }
.grid > .field + .field { margin-top: 0; }
.hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="search"], select {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 9px; padding: 9px 12px; color: var(--text);
}
input[type="text"]:focus, input[type="search"]:focus, select:focus { border-color: var(--accent-line); outline: none; box-shadow: 0 0 0 3px rgba(79, 209, 165, 0.15); }
input::placeholder { color: #5f7774; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; color: var(--text-2); margin: 10px 0 0; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.radio-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.radio-card {
  position: relative; display: flex; gap: 12px; padding: 14px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--bg-2);
  cursor: pointer; margin: 0; font-weight: 500;
}
.radio-card input { position: absolute; opacity: 0; pointer-events: none; }
.radio-card:has(input:checked) { border-color: var(--accent-line); background: var(--accent-soft); }
.radio-card:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.radio-card strong { display: block; color: var(--text); font-size: 13.5px; }
.radio-card span.d { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
details > summary { cursor: pointer; color: var(--text-2); font-weight: 600; }
details > summary::marker { color: var(--accent); }

/* ------------------------------------------------------------------ layout */
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
.eyebrow { font: 600 10.5px var(--font); letter-spacing: 0.22em; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
.page-head h1 { font-size: 27px; color: #fff; line-height: 1.3; }
.page-head .sub { color: var(--muted); margin-top: 6px; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.grid.halves { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card-label { font: 600 10.5px var(--font); letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
.card h2 { font-size: 17px; color: #fff; margin-top: 4px; }
.card h3 { font-size: 14.5px; color: var(--text); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.note { font-size: 12px; color: var(--muted); margin-top: 12px; }
.divider { height: 1px; background: var(--border); margin: 14px 0; border: 0; }

/* ------------------------------------------------------------------ banners and chips */
.banner {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--danger-line);
  background: linear-gradient(0deg, var(--danger-soft), var(--danger-soft)), #1a1112; margin-bottom: 10px;
}
.banner .icon { color: var(--danger); margin-top: 2px; }
.banner strong { display: block; color: #ffd9d6; font-size: 13px; }
.banner .detail { color: #e8b4af; font-size: 12px; word-break: break-word; }
.banner.ok { border-color: var(--accent-line); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)), #0f1a17; }
.banner.ok .icon { color: var(--accent); }
.banner.ok strong { color: #d9fff0; }
.banner .close { margin-left: auto; }
.banner.info { border-color: rgba(108, 180, 255, 0.35); background: linear-gradient(0deg, var(--info-soft), var(--info-soft)), #0f1620; }
.banner.info .icon { color: var(--info); }
.banner.info strong { color: #dcecff; }
.banner.info .detail { color: #b9d4f2; }
.banner.demo { margin: 0 0 10px; }
.strip {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--radius); border: 1px solid var(--accent-line);
  background: linear-gradient(90deg, rgba(79, 209, 165, 0.12), rgba(79, 209, 165, 0.04)); margin-bottom: 16px;
}
.strip.mock { border-color: rgba(108, 180, 255, 0.4); background: linear-gradient(90deg, rgba(108, 180, 255, 0.12), rgba(108, 180, 255, 0.03)); }
.strip .icon { color: var(--accent); }
.strip.mock .icon { color: var(--info); }
.strip strong { display: block; color: #fff; font-size: 13.5px; }
.strip .d { color: var(--text-2); font-size: 12.5px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 6px;
  border: 1px solid var(--border-2); color: var(--text-2); background: rgba(255, 255, 255, 0.02); white-space: nowrap;
}
.chip.ok { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.chip.warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-soft); }
.chip.danger { color: var(--danger); border-color: var(--danger-line); background: var(--danger-soft); }
.chip.info { color: var(--info); border-color: rgba(108, 180, 255, 0.45); background: var(--info-soft); }
.chip.violet { color: var(--violet); border-color: rgba(167, 139, 250, 0.45); background: rgba(167, 139, 250, 0.1); }
.chip.mono { font-family: var(--mono); font-weight: 500; }
.sev-Critical { color: #ff8f86; border-color: rgba(239, 107, 98, 0.6); background: rgba(239, 107, 98, 0.14); }
.sev-High { color: var(--orange); border-color: rgba(251, 146, 60, 0.5); background: rgba(251, 146, 60, 0.1); }
.sev-Medium { color: var(--warn); border-color: var(--warn-line); background: var(--warn-soft); }
.sev-Low { color: var(--info); border-color: rgba(108, 180, 255, 0.45); background: var(--info-soft); }
.sev-None { color: var(--muted); }

/* ------------------------------------------------------------------ home */
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.feature { position: relative; overflow: hidden; padding: 30px; min-height: 360px; display: flex; flex-direction: column; justify-content: flex-start;
  background: radial-gradient(120% 90% at 45% 20%, rgba(79, 209, 165, 0.1), transparent 60%), var(--panel); }
.orbit { position: relative; flex: none; width: 220px; height: 220px; margin: 0 auto 26px; }
.orbit .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(79, 209, 165, 0.16); }
.orbit .ring.r2 { inset: 34px; border-color: rgba(79, 209, 165, 0.22); }
.orbit .core {
  position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; transform: translate(-50%, -50%); border-radius: 16px;
  display: grid; place-items: center; color: var(--accent); background: rgba(79, 209, 165, 0.12); border: 1px solid var(--accent-line);
  box-shadow: 0 0 40px rgba(79, 209, 165, 0.18);
}
.orbit .sat {
  position: absolute; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--text-2);
  background: var(--panel-2); border: 1px solid var(--border-2);
}
.orbit .s1 { left: 38%; top: 2%; } .orbit .s2 { right: 0; top: 36%; } .orbit .s3 { left: 42%; bottom: 0; } .orbit .s4 { left: 2%; top: 58%; }
.feature .eyebrow { margin-top: 0; }
.feature h2 { font-size: 25px; line-height: 1.45; color: #fff; }
.feature p { color: var(--text-2); margin: 12px 0 18px; max-width: 520px; }
.numbered { display: flex; flex-direction: column; gap: 16px; }
.numbered .card { display: flex; gap: 14px; position: relative; }
.numbered .num { position: absolute; right: 18px; top: 14px; font: 600 18px var(--mono); color: #6f8c89; }
.numbered .ic { color: var(--text-2); margin-top: 2px; }
.numbered h3 { margin-bottom: 4px; }
.numbered p { color: var(--muted); font-size: 12.5px; padding-right: 26px; }
.callout { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 14px 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); color: var(--text-2); font-size: 12.5px; }
.callout .icon { color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 16px 0; }

/* ------------------------------------------------------------------ tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13px; }  /* phones scroll the region sideways */
caption { text-align: left; padding: 0 0 8px; color: var(--muted); font-size: 12px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--bg-2); position: sticky; top: 0; white-space: nowrap; }
td code.mono { white-space: nowrap; }
td .t-sub { overflow-wrap: anywhere; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td, tbody tr.clickable:focus-visible td { background: var(--panel-2); }
tbody tr.clickable:focus-visible { outline: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td .t-title { color: var(--text); font-weight: 600; }
td .t-sub { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
.empty-state { padding: 34px 20px; text-align: center; color: var(--muted); }
.empty-state .icon { color: var(--border-2); width: 34px; height: 34px; margin-bottom: 8px; }

/* ------------------------------------------------------------------ run page */
.meta-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
.meta-row .mono { color: var(--text-2); }
.meta-row .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 220px; padding: 6px; border-radius: 10px;
  background: var(--panel-2); border: 1px solid var(--border-2); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
}
.menu-list a, .menu-list button {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 7px; color: var(--text); font-size: 12.5px;
  background: transparent; border: 0; cursor: pointer; text-align: left;
}
.menu-list a:hover, .menu-list button:hover { background: var(--panel-3); text-decoration: none; }
.pipeline { padding: 18px 22px 20px; }
.stepper { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin-top: 18px; }
.step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 0 2px; }
.step::before { content: ""; position: absolute; top: 14px; left: calc(-50% + 16px); right: calc(50% + 16px); height: 2px; background: var(--border-2); }
.step:first-child::before { display: none; }
.step.done::before, .step.skipped::before, .step.running::before { background: rgba(79, 209, 165, 0.45); }
.step .node {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--mono); color: var(--muted);
  border: 1px solid var(--border-2); background: var(--bg-2); position: relative; z-index: 1;
}
.step.done .node { background: rgba(79, 209, 165, 0.16); border-color: var(--accent-line); color: var(--accent); }
.step.skipped .node { background: var(--panel-2); border-style: dashed; color: var(--muted); }
.step.running .node { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 5px rgba(79, 209, 165, 0.18); }
.step.failed .node { background: var(--danger-soft); border-color: var(--danger-line); color: var(--danger); }
.step .s-label { font-size: 11.5px; color: var(--text-2); line-height: 1.35; }
.step.pending .s-label { color: var(--muted); }
.step .s-layer { font: 500 10px var(--mono); color: var(--muted); }
.stage-note { margin-top: 14px; font-size: 12px; color: var(--muted); min-height: 18px; }
.verdicts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat .s-top { display: flex; justify-content: space-between; color: var(--text-2); font-size: 12.5px; font-weight: 600; }
.stat .s-top .icon { color: var(--muted); }
.stat .value { font: 600 30px var(--font); color: #fff; font-variant-numeric: tabular-nums; }
.stat .value.warn { color: var(--warn); }
.stat .value.danger { color: var(--danger); }
.stat .s-sub { color: var(--muted); font-size: 11.5px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 22px 0 18px; overflow-x: auto; }
.tabs a { padding: 10px 14px; color: var(--muted); font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--text); text-decoration: none; }
.tabs a[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.member { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--border); }
.member:last-child { border-bottom: 0; }
.avatar { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; flex: none; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--text-2); }
.avatar.context { color: var(--accent); background: rgba(79, 209, 165, 0.1); border-color: rgba(79, 209, 165, 0.3); }
.avatar.reviewers { color: var(--violet); background: rgba(167, 139, 250, 0.1); border-color: rgba(167, 139, 250, 0.3); }
.avatar.skeptic { color: var(--info); background: var(--info-soft); border-color: rgba(108, 180, 255, 0.3); }
.avatar.redteam { color: var(--orange); background: rgba(251, 146, 60, 0.1); border-color: rgba(251, 146, 60, 0.3); }
.avatar.judges { color: var(--accent-2); background: rgba(45, 212, 191, 0.1); border-color: rgba(45, 212, 191, 0.3); }
.member .m-main { flex: 1; min-width: 0; }
.member .m-role { display: flex; gap: 8px; align-items: baseline; font-weight: 650; color: #fff; }
.member .m-role code { color: var(--muted); font-size: 11px; font-weight: 400; }
.member .m-model { color: var(--text-2); font-size: 12.5px; word-break: break-word; }
.member .m-sub { color: var(--muted); font-size: 11.5px; }
.member .m-side { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex: none; }
.bar-row + .bar-row { margin-top: 14px; }
.bar-row .b-top { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; gap: 10px; }
.bar-row .b-top .mono { color: var(--text); }
.bar { height: 6px; border-radius: 4px; background: var(--panel-3); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 4px; background: var(--accent); width: 0; }
.bar.warn > span { background: var(--warn); }
.bar.danger > span { background: var(--danger); }
.gap-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--warn-line); background: var(--warn-soft); border-radius: 8px; color: #f2dcae; font-size: 12.5px; }
.gap-item + .gap-item { margin-top: 10px; }
.gap-item .icon { color: var(--warn); margin-top: 1px; }
.gap-item code { color: #e9c989; word-break: break-all; }
.gap-item.ok { border-color: var(--accent-line); background: var(--accent-soft); color: #c9f5e5; }
.gap-item.ok .icon { color: var(--accent); }
.kv { display: grid; grid-template-columns: minmax(110px, 0.42fr) minmax(0, 1fr); gap: 0; font-size: 12.5px; }
.kv dt, .kv dd { padding: 9px 0; border-bottom: 1px solid var(--border); margin: 0; }
.kv dt { color: var(--muted); padding-right: 12px; }
.kv dd { color: var(--text); word-break: break-all; font-family: var(--mono); font-size: 12px; }
.kv dd.text { font-family: var(--font); font-size: 12.5px; word-break: normal; }
.kv dt:nth-last-of-type(1), .kv dd:last-of-type { border-bottom: 0; }
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.dim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.dim h2 { font-size: 14.5px; color: var(--text); margin-top: 0; }
.dim .d-score { font: 600 26px var(--font); color: #fff; font-variant-numeric: tabular-nums; }
.dim .d-score.warn { color: var(--warn); }
.dim .d-score.danger { color: var(--danger); }
.dim .d-counts { display: flex; gap: 12px; color: var(--muted); font-size: 12px; margin-top: 10px; flex-wrap: wrap; }
.dim .d-counts strong { color: var(--text); }
.log { background: #071012; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; max-height: 420px; overflow: auto; color: #b9d3cf; font-size: 12px; line-height: 1.6; }
.quote { background: #071012; border: 1px solid var(--border); border-left: 3px solid var(--accent-line); border-radius: 8px; padding: 10px 12px; color: #cfe5e1; }
.quote.unverified { border-left-color: var(--danger-line); }

/* ------------------------------------------------------------------ drawer */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(3, 8, 9, 0.6); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); z-index: 41; background: var(--bg-2); border-left: 1px solid var(--border-2);
  display: flex; flex-direction: column; box-shadow: -24px 0 60px rgba(0, 0, 0, 0.45);
}
.drawer .drawer-head { display: flex; gap: 12px; align-items: flex-start; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.drawer .drawer-head h2 { font-size: 16px; color: #fff; outline: none; }
.drawer .d-body { padding: 18px 20px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.drawer section h3 { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.drawer section p { color: var(--text-2); font-size: 13px; }
.drawer td:not(:last-child) { white-space: nowrap; }
.drawer table { min-width: 0; }

/* ------------------------------------------------------------------ responsive */
@media (max-width: 1100px) {
  .grid.four, .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.two, .hero-grid { grid-template-columns: minmax(0, 1fr); }
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filters .f-search { grid-column: 1 / -1; }
}
@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  .recent { max-height: 220px; overflow-y: auto; }
  .topbar { padding: 10px 16px; position: static; }
  main { padding: 20px 16px 48px; }
  #banner-area { padding: 14px 16px 0; }
  .stepper { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 16px; }
  .step::before { display: none; }
}
@media (max-width: 640px) {
  .orbit { width: 170px; height: 170px; }
  .feature { padding: 22px; }
  .grid.four, .grid.halves, .grid.three, .kpis, .radio-cards, .filters { grid-template-columns: minmax(0, 1fr); }
  .page-head { flex-direction: column; }
  .top-actions .svc span:last-child { display: none; }
  .kv { grid-template-columns: minmax(0, 1fr); }
  .kv dt { border-bottom: 0; padding-bottom: 0; }
  /* the counters go under the text: beside it, a long one ("refusals, truncations, errors: 1") covered the role and model */
  .member { flex-wrap: wrap; }
  .member .m-main { flex: 1 1 0; }
  .member .m-side { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; align-items: flex-start; text-align: left; padding-left: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  .dot.pulse { animation: none; }
}

<script>/* MARA workbench (docs/adr/0006-local-web-workbench.md).
 *
 * One page, no dependencies, no build step. The Content-Security-Policy allows exactly this script by hash and
 * requires Trusted Types, so the DOM is built only through element and text APIs (h(), textContent, append,
 * fill()): repository-derived text - titles, quotes, arguments, file names - is always text, never markup.
 * Every number on the page comes from the server, which reads the validated report; nothing is re-derived here.
 *

  async function viewRun(main, seq, route) {
    const id = route.id;
    const data = await api("GET", "/api/runs/" + enc(id));
    let view = null;
    if (data.run.has_report) {
      try { view = await api("GET", "/api/runs/" + enc(id) + "/report"); } catch (e) { if (e.code !== "no_report") throw e; }
    }
    if (seq !== renderSeq) return;
    const page = buildRunPage(data, view, route, seq);
    fill(main, page.root);
    if (ACTIVE.includes(data.run.status)) {
      let inFlight = false;
      every(RUN_POLL_MS, async () => {
        if (inFlight || seq !== renderSeq) return;
        inFlight = true;
        try {
          const next = await api("GET", "/api/runs/" + enc(id));
          if (seq !== renderSeq) return;
          if (!ACTIVE.includes(next.run.status)) { await refreshRuns(); render(false); return; }
          page.update(next);
        } catch (e) { /* the service dot shows a lost connection */ } finally { inFlight = false; }
      });
    }
  }

          h("td", null, mono((r.file || "—") + (r.line ? ":" + r.line : ""))), h("td", null, h("span", { class: "small" }, String(r.message || "").slice(0, 400))))))
        : emptyState(t("tools.none"), "code"));
    }
    which.addEventListener("change", draw);
    draw();
    return h("div", { class: "stack" }, card(t("tools.health_label"), t("tools.health"), health),
      card(t("tools.results_label"), t("tools.results"), h("div", { class: "stack" }, h("div", { style: { "max-width": "260px" } }, which), slot,
        h("p", { class: "note" }, t("tools.note")))));
  }

  function tabQueue(view) {
    if (!view.human_queue.length) return emptyState(t("queue.none"), "users");
    return h("div", { class: "stack" }, h("p", { class: "note" }, t("queue.note")), ...view.human_queue.map((q) => card(q.finding_id + " · " + dimLabel(q.dimension), q.title,
      h("div", { class: "stack" },
        h("div", { class: "row" }, chip(q.cwe, "mono"), tierChip(q.tier), chip(t("queue.score", { v: q.weighted_score.toFixed(3) })),
          chip(t("drawer.votes_v", { tp: q.votes_tp, fp: q.votes_fp, human: q.votes_human }))),
        h("div", { class: "row" }, mono(q.file + ":" + q.line)),
        h("pre", { class: "quote" }, q.quote),
        h("div", { class: "row" }, q.reasons.map((r) => chip(tCode("hreason.", r.split(":")[0]), "warn", r))),
        h("div", { class: "small muted" }, t("queue.key"), " ", mono(q.key))))));
  }

  function tabLog(run, progress, panel, seq) {
    const stagesSlot = h("div");
    const progressLog = h("pre", { class: "log", tabindex: "0" });
    const pipelineLog = h("pre", { class: "log", tabindex: "0" });
    const runLog = h("pre", { class: "log", tabindex: "0" });
    function drawStages(p, r) {
      const active = ACTIVE.includes((r || run).status);
      const stages = (p && p.stages ? p.stages : []).map((s) => (s.status === "running" && !active ? { ...s, status: "failed" } : s));
      fill(stagesSlot, stages.length ? tableWrap(t("log.stages"), [t("col.stage"), t("col.status"), t("col.started"), { label: t("col.duration"), num: true }, t("col.note")],
        stages.map((s) => h("tr", null, h("td", null, tCode("stage.", s.id), " ", h("span", { class: "s-layer small muted" }, STAGE_LAYER[s.id])),
          h("td", null, chip(tCode("stage_status.", s.status), { done: "ok", running: "info", failed: "danger", skipped: "" }[s.status] || "")),
          h("td", null, fmtTime(s.started_at, true)), h("td", { class: "num" }, s.started_at ? fmtDuration(elapsed(s.started_at, s.finished_at)) : "—"),
          h("td", null, h("span", { class: "small" }, s.note || "")))))
        : emptyState(t("stage.no_progress"), "clock"));
    }
    async function loadLogs() {
      try {
        const data = await api("GET", "/api/runs/" + enc(run.id) + "/log?tail=600");
        if (seq !== renderSeq) return;
        for (const [el, text] of [[progressLog, data.progress_log.join("\n")], [pipelineLog, data.pipeline_log], [runLog, data.run_log]]) {
          const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
          el.textContent = text || t("log.empty");
          if (atEnd) el.scrollTop = el.scrollHeight;
        }
      } catch (e) { /* shown on the next poll */ }
    }
    drawStages(progress, run);
    loadLogs();
    panel.append(h("div", { class: "stack" },
      card(t("log.stages_label"), t("log.stages"), stagesSlot),
      run.argv && run.argv.length ? card(t("log.argv_label"), t("log.argv"), h("pre", { class: "log", tabindex: "0" }, run.argv.join(" "))) : null,
      card(t("log.progress_label"), t("log.progress"), progressLog),
      card(t("log.pipeline_label"), t("log.pipeline"), pipelineLog),
      card(t("log.run_label"), t("log.run"), runLog)));
    return (p, r) => { drawStages(p, r); loadLogs(); };
  }

  // ---------------------------------------------------------------- environment
  async function viewEnv(main, seq) {
    const [env, configs, jobs] = await Promise.all([loadEnv(true), loadConfigs(true), api("GET", "/api/jobs")]);
    if (seq !== renderSeq) return;
    const jobSlot = h("div");
    const running = (jobs.jobs || []).find((j) => j.status === "running");
    let watching = running ? running.id : (jobs.jobs || [])[0] ? jobs.jobs[0].id : null;

    async function drawJob() {
      if (!watching) { fill(jobSlot, h("p", { class: "muted small" }, t("env.job.none"))); return; }
      try {
        const data = await api("GET", "/api/jobs/" + enc(watching));
        if (seq !== renderSeq) return;
        const j = data.job;
        const cls = { running: "info", finished: "ok", failed: "danger", interrupted: "warn" }[j.status] || "";
        fill(jobSlot, h("div", { class: "stack" },
          h("div", { class: "row" }, chip(tCode("job.", j.kind)), chip(tCode("job_status.", j.status), cls), h("span", { class: "small muted" }, fmtTime(j.started_at, true)),
            j.exit_code !== null && j.exit_code !== undefined ? chip(t("env.job.exit", { code: j.exit_code })) : null),
          h("pre", { class: "log", tabindex: "0" }, j.argv.join(" ")), h("pre", { class: "log", tabindex: "0" }, j.log_tail || t("log.empty"))));
        if (j.status !== "running" && running && running.id === j.id) { state.env = null; render(false); }
      } catch (e) { fill(jobSlot, emptyState(tCode("error.", e.code), "alert")); }
    }
    async function startJob(body, confirmKey) {
      if (confirmKey && !window.confirm(t(confirmKey))) return;
      try {
        const data = await api("POST", "/api/jobs", body);
        watching = data.job.id;
        showOk(t("env.job.started", { job: tCode("job.", body.kind) }));
        render(false);
      } catch (e) { showError(e); }
    }
    if (running) every(RUN_POLL_MS, () => { if (seq === renderSeq) drawJob(); });

    const rows = env.tools.rows;
    const statusCls = { ok: "ok", missing: "warn", version_mismatch: "danger", unverified: "warn" };
    const scanners = rows.filter((r) => r.role !== "verifier");
    const missing = rows.filter((r) => r.status !== "ok").map((r) => r.name);
    const actions = env.actions || {};
    const busy = Boolean(running);
    const toolTable = tableWrap(t("env.tools.title"), [t("col.tool"), t("col.role"), t("col.locked"), t("col.installed"), t("col.verify"), t("col.dimensions"), t("col.status")],
      rows.map((r) => h("tr", null,
        h("td", null, h("div", { class: "t-title" }, r.name), h("div", { class: "t-sub" }, r.kind + (r.license ? " · " + r.license : ""))),
        h("td", null, tCode("tool_role.", r.role)),
        h("td", null, mono(r.locked_version)),
        h("td", null, mono(r.installed_version || "—")),
        h("td", null, h("div", null, r.verify_method), r.signature_verified === null ? null : h("div", { class: "t-sub" }, t(r.signature_verified ? "env.sig_ok" : "env.sig_no"))),
        h("td", null, (r.dimensions || []).map(dimLabel).join("、") || "—"),
        h("td", null, chip(tCode("tool_status.", r.status), statusCls[r.status] || "")))));
    const lockNote = env.tools.lock_matches_manifest === false ? h("div", { class: "gap-item" }, icon("alert", "sm"), h("span", null, t("env.lock_changed"))) : null;
    const platformNote = env.tools.locked_platform && env.tools.locked_platform.os && !String(env.tools.host_platform.os).startsWith(env.tools.locked_platform.os)
      ? h("div", { class: "gap-item" }, icon("alert", "sm"), h("span", null, t("env.platform", { os: env.tools.host_platform.os, locked: env.tools.locked_platform.os }))) : null;

    const wsCard = card(t("env.ws.label"), t("env.ws.title"), h("div", { class: "stack" }, kv([
      [t("env.ws.workspace"), mono(env.workspace)],
      [t("env.ws.out"), mono(env.out_dir)],
      [t("env.ws.tools"), mono(env.tools.tools_dir)],
      [t("env.ws.trivy"), mono(env.trivy_db.cache_dir)],
      [t("env.ws.python"), mono(env.python.version + " · " + env.python.executable)],
      [t("env.ws.platform"), mono(env.platform)],
      [t("env.ws.node"), env.node.path ? h("span", { class: "row" }, mono(env.node.version + " · " + env.node.path), env.node.ok ? null : chip(t("env.node_old"), "warn"))
        : chip(t("env.node_missing"), "warn")],
      [t("env.ws.version"), mono(env.version)],
    ]), h("div", null, h("div", { class: "card-label", style: { "margin-bottom": "8px" } }, t("env.ws.vars")),
      h("div", { class: "row" }, Object.entries(env.env_vars).map(([k, v]) => chip(k, v ? "ok" : "", t(v ? "env.var_set" : "env.var_unset")))))));

    const toolsCard = card(t("env.tools.label"), t("env.tools.title"), h("div", { class: "stack" },
      h("div", { class: "row" }, chip(t("env.tools.summary", { ok: scanners.filter((r) => r.status === "ok").length, total: scanners.length }),
        scanners.every((r) => r.status === "ok") ? "ok" : "warn"), h("span", { class: "spacer" }),
        btn(t("env.install_missing"), { small: true, icon: "download", disabled: busy || !actions.install_tools || !missing.length,
          onClick: () => startJob({ kind: "install_tools", only: missing }, "env.confirm_install") }),
        btn(t("env.install_all"), { small: true, kind: "primary", icon: "download", disabled: busy || !actions.install_tools,
          onClick: () => startJob({ kind: "install_tools" }, "env.confirm_install") })),
      lockNote, platformNote, toolTable, h("p", { class: "note" }, t("env.tools.note"))));

    const trivyCard = card(t("env.trivy.label"), t("env.trivy.title"), h("div", { class: "stack" },
      h("div", { class: "row" }, env.trivy_db.ok ? chip(t("env.trivy.ok"), "ok") : chip(t(env.trivy_db.present ? "env.trivy.bad" : "env.trivy.missing"), "warn"),
        chip(t("env.trivy.limit", { h: env.trivy_db.max_age_hours })), h("span", { class: "spacer" }),
        btn(t("env.trivy.check"), { small: true, icon: "search", disabled: busy || !actions.trivy_db_status, onClick: () => startJob({ kind: "trivy_db_status" }) }),
        btn(t("env.trivy.download"), { small: true, kind: "primary", icon: "database", disabled: busy || !actions.trivy_db_download,
          onClick: () => startJob({ kind: "trivy_db_download" }, "env.confirm_trivy") })),
      h("pre", { class: "log", tabindex: "0" }, (env.trivy_db.lines || []).join("\n"))));

    const jobCard = card(t("env.job.label"), t("env.job.title"), jobSlot);

    const cfgCards = configs.map((c) => {
      const passed = c.policies.filter((p) => p.passed).length;
      const body = c.structure_ok ? h("div", { class: "stack", style: { "margin-top": "14px" } },
        tableWrap(t("env.cfg.models"), [t("col.model_name"), t("col.family"), t("col.provider"), t("col.model"), t("col.residency"), t("col.credential")],
          c.models.map((m) => h("tr", null, h("td", null, mono(m.name)), h("td", null, m.family), h("td", null, tCode("provider.", m.provider)),
            h("td", null, mono(m.model), m.endpoint_host ? h("div", { class: "t-sub" }, m.endpoint_host) : null), h("td", null, tCode("residency.", m.data_residency)),
            h("td", null, m.credential.env ? chip(m.credential.env + " · " + t(m.credential.present ? "cred.present" : "cred.missing"), m.credential.present ? "ok" : "warn")
              : chip(t("cred.none")))))),
        h("div", { class: "row" }, ROLES.map((r) => {
          const v = c.roles[r];
          return chip(tCode("role.", r) + ": " + (Array.isArray(v) ? v.join(", ") : v || "—"));
        })),
        tableWrap(t("env.cfg.policies"), [t("col.policy"), t("col.status"), t("col.reason")], c.policies.map((p) => h("tr", null,
          h("td", null, h("div", { class: "t-title" }, p.id + " " + tCode("policy.", p.id)), h("div", { class: "t-sub" }, p.name)),
          h("td", null, chip(t(p.passed ? "policy.pass" : "policy.fail"), p.passed ? "ok" : "danger")), h("td", null, h("span", { class: "small" }, p.reason))))),
        h("div", { class: "row" }, h("span", { class: "spacer" }), btn(t("env.cfg.check"), { small: true, icon: "terminal", disabled: busy,
          onClick: () => startJob({ kind: "check_config", config: c.path }) })))
        : h("div", { class: "gap-item", style: { "margin-top": "12px" } }, icon("alert", "sm"), h("span", null, t("env.cfg.invalid"), " ", mono(c.error)));
      return h("details", { class: "card flat" }, h("summary", null, h("span", { class: "row", style: { display: "inline-flex" } }, mono(c.path),
        chip(c.provider_mode ? tCode("mode.", c.provider_mode) : t("env.cfg.invalid_short"), c.provider_mode === "live" ? "ok" : c.provider_mode === "mock" ? "info" : "warn"),
        c.structure_ok ? chip(t("new.policies", { passed, total: c.policies.length }), c.loadable ? "ok" : "danger") : null)), body);
    });

    const settings = (state.session && state.session.settings) || {};
    const langSel = h("select", { id: "s-lang" }, LANGS.map((l) => h("option", { value: l, selected: l === lang }, t("lang." + l))));
    const provSel = h("select", { id: "s-prov" }, ["mock", "live"].map((p) => h("option", { value: p, selected: (settings.default_provider || "mock") === p }, tCode("mode.", p))));
    const cfgSel = h("select", { id: "s-cfg" }, h("option", { value: "" }, t("settings.auto")),
      configs.filter((c) => c.structure_ok).map((c) => h("option", { value: c.path, selected: settings.default_config === c.path }, c.path)));
    const save = btn(t("settings.save"), { kind: "primary", small: true, onClick: async () => {
      try {
        const res = await api("PUT", "/api/settings", { language: langSel.value, default_provider: provSel.value, default_config: cfgSel.value });
        if (state.session) state.session.settings = res;
        setLang(res.language);
        showOk(t("settings.saved"));
      } catch (e) { showError(e); }
    } });
    const settingsCard = card(t("settings.label"), t("settings.title"), h("div", { class: "grid three" },
      h("div", { class: "field" }, h("label", { for: "s-lang" }, t("settings.language")), langSel),
      h("div", { class: "field" }, h("label", { for: "s-prov" }, t("settings.provider")), provSel),
      h("div", { class: "field" }, h("label", { for: "s-cfg" }, t("settings.config")), cfgSel)), { right: save });

    fill(main, h("div", { class: "stack" },
      pageHead(t("env.eyebrow"), t("env.heading"), t("env.sub")),
      h("div", { class: "grid halves" }, wsCard, h("div", { class: "stack" }, trivyCard, jobCard)),
      toolsCard,
      card(t("env.cfg.label"), t("env.cfg.title"), h("div", { class: "stack" }, h("p", { class: "small muted" }, t("env.cfg.note")), ...cfgCards)),
      settingsCard));
    drawJob();
  }

  // ---------------------------------------------------------------- boot
  function setLang(next) {
    if (!LANGS.includes(next) || next === lang) return;
    lang = next;
    store.set("mara.lang", lang);
    render(false);
  }

  async function startSession() {
    if (!TOKEN && !DEMO) { showLoggedOut(); return; }
    try {
      state.session = await api("GET", "/api/session");
      if (!store.get("mara.lang") && state.session.settings && LANGS.includes(state.session.settings.language)) lang = state.session.settings.language;
    } catch (e) {
      if (e.code !== "unauthenticated") showError(e);
      if (loggedOut) return;
    }
    await render(false);
  }

  async function boot() {
    applyStatic();
    document.getElementById("lang-toggle").addEventListener("click", () => setLang(lang === "zh-TW" ? "en" : "zh-TW"));
    document.getElementById("refresh").addEventListener("click", () => { state.env = null; state.configs = null; refreshRuns().then(() => render(false)).catch(showError); });
    document.getElementById("logout").addEventListener("click", () => {
      // this browser forgets the key; the server and any running review go on, and the printed URL still opens it
      store.remove(TOKEN_KEY);
      TOKEN = "";
      showLoggedOut();
    });
    window.addEventListener("hashchange", () => {
      if (takeToken()) { loggedOut = false; startSession(); return; }
      render(true);
    });
    if (DEMO) {
      // nothing to sign out of and nothing to poll: the data is a snapshot, and every change is refused
      document.getElementById("logout").remove();  // .btn would override the hidden attribute
      const area = document.getElementById("banner-area");
      area.before(h("aside", { class: "banner info demo", "aria-label": t("top.demo") }, icon("info"),
        h("div", null, h("strong", null, t("demo.title")), h("div", { class: "detail" }, t("demo.body", { when: fmtTime(DEMO.captured_at, true) })))));
      await startSession();
      return;
    }
    takeToken();
    await startSession();
    const pollList = async () => {
      if (!loggedOut) {
        try { await refreshRuns(); } catch (e) { /* the service dot shows it */ }
      }
      setTimeout(pollList, state.busy ? LIST_POLL_MS : IDLE_LIST_POLL_MS);
    };
    setTimeout(pollList, LIST_POLL_MS);
    setInterval(() => { if (!loggedOut) api("GET", "/api/health").catch(() => setService(false)); }, HEALTH_MS);
  }

  boot();
})();
