[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mara"
dynamic = ["version"]  # from mara.__version__ (src/mara/__init__.py); tests/test_version.py ties it to docs/CHANGELOG.md
description = "MARA - Multi-Agent Review Architecture: heterogeneous-model security and architecture review for vibe-coded software"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "anthropic[bedrock]>=1.0",  # bedrock: boto3 for Claude on Amazon Bedrock (provider: bedrock)
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "markdown>=3.6", "jsonschema>=4.18"]

[project.scripts]
mara = "mara.cli:app"

[tool.setuptools.dynamic]
version = { attr = "mara.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mara = ["prompts/*.md", "groundtruth/*.json", "groundtruth/cyclonedx/*.json", "scoring/*.json"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
files = ["src"]
python_version = "3.11"  # the oldest supported interpreter, even when run on 3.12

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
