<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
__MARA_HEAD__<meta name="color-scheme" content="dark">
<title>MARA 安全審查工作台</title>
<style>__MARA_CSS__</style>
</head>
<body>
<a class="skip" href="#content" data-i18n="a11y.skip">跳至主要內容</a>
<div class="shell">
  <aside class="sidebar" aria-labelledby="brand-name">
    <div class="brand">
      <svg class="icon logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
      <div>
        <div class="brand-name"><span id="brand-name">MARA</span><span class="version-chip">__MARA_VERSION__</span></div>
        <div class="brand-sub" data-i18n="brand.sub">安全審查工作台</div>
      </div>
    </div>
    <div class="ws-label"><span class="dot"></span><span data-i18n="nav.workspace">LOCAL WORKSPACE</span></div>
    <nav class="nav" id="main-nav" data-i18n-aria="nav.label" aria-label="主選單"></nav>
    <section class="recent" aria-labelledby="recent-h">
      <h2 class="side-h" id="recent-h" data-i18n="nav.recent">最近的評估</h2>
      <ul id="recent-list"></ul>
    </section>
    <div class="side-foot">
      <svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v10H5z"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <div><strong data-i18n="side.local">執行於本機</strong><span data-i18n="side.local_sub">原始碼只依設定送往允許的模型端點</span></div>
    </div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <nav class="crumbs" id="crumbs" data-i18n-aria="nav.breadcrumb" aria-label="導覽路徑"></nav>
      <div class="top-actions">
        <button type="button" class="btn ghost small" id="lang-toggle">English</button>
        <span class="svc" id="svc-status" role="status"><span class="dot muted"></span><span data-i18n="top.connecting">連線中…</span></span>
        <button type="button" class="icon-btn" id="refresh" data-i18n-aria="top.refresh" aria-label="重新整理">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button type="button" class="btn ghost small" id="logout" data-i18n="top.logout">登出</button>
      </div>
    </header>
    <div id="banner-area" aria-live="polite"></div>
    <main id="content" tabindex="-1"></main>
  </div>
</div>
__MARA_DEMO__<script type="application/json" id="i18n">__MARA_I18N__</script>
<script>__MARA_JS__</script>
</body>
</html>
