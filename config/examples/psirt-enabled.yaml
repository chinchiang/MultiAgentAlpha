# Example: the global pipeline reviewing a shipped product with the PSIRT hand-off enabled (G-12).
# `mara check-config config/examples/psirt-enabled.yaml` passes P1-P6.
models:
  - { name: claude-reviewer,   family: anthropic, provider: anthropic,         model: claude-opus-5,            api_key_env: ANTHROPIC_API_KEY, data_residency: vendor_api_zdr }
  - { name: deepseek-reviewer, family: deepseek,  provider: openai_compatible, model: deepseek-v3.2,            base_url: http://vllm-deepseek.internal:8000/v1, api_key_env: DEEPSEEK_LOCAL_KEY, data_residency: on_prem }
  - { name: nemotron-reviewer, family: nemotron,  provider: openai_compatible, model: nvidia/nemotron-3-super,  base_url: http://nim-nemotron.internal:8000/v1, api_key_env: NIM_LOCAL_KEY, data_residency: on_prem }
roles:
  reviewers: [claude-reviewer, deepseek-reviewer, nemotron-reviewer]
  skeptic: nemotron-reviewer
  redteam: deepseek-reviewer
  judges: [claude-reviewer, deepseek-reviewer, nemotron-reviewer]
gate: { block_on_tiers: [A, B], block_on_severity: [High, Critical], min_dimension_score: 60, accept_threshold: 0.6, human_threshold_alpha: 0.4 }
psirt:
  enabled: true
  webhook_url: https://psirt.example.internal/api/cra-intake
  token_env: PSIRT_WEBHOOK_TOKEN
  product: "IPC-7000 firmware web console"
  shipped: true
  trigger_tiers: [A]
  trigger_severities: [Critical]
  early_warning_hours: 24
  notification_hours: 72
  final_report_days: 14
