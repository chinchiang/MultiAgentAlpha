# In-country pipeline for 上海／重慶 (report chapter 26, CN-1): two on-prem families (DeepSeek, GLM), no cross-border model.
# Passes the policies only because reduced_panel_reason is stated.
models:
  # DeepSeek as the IEC gateway serves it (`model: deepseek`, the same alias the cold standbys use), from the
  # site's own in-country instance of the gateway: the address below is a placeholder, and source code must not
  # leave the country, so it may never be the gateway outside the site.
  - name: deepseek-local
    family: deepseek
    provider: openai_compatible
    model: deepseek
    base_url: https://10.20.30.40:8000/v1
    api_key_env: DEEPSEEK_LOCAL_KEY
    data_residency: on_prem
  # GLM from the same in-country gateway instance (`model: glm`), with the schema as guidance as in config/mara.yaml.
  - name: glm-local
    family: glm
    provider: openai_compatible
    model: glm
    base_url: https://10.20.30.40:8000/v1
    api_key_env: GLM_LOCAL_KEY
    strict_schema: false
    data_residency: on_prem
roles:
  reviewers: [deepseek-local, glm-local]
  skeptic: glm-local
  redteam: deepseek-local
  judges: [deepseek-local, glm-local]
gate:
  human_threshold_alpha: 0.5           # tighter human queue to compensate for the smaller panel
reduced_panel_reason: "中國廠區境內管線：Claude API 在境外，依 CSL/DSL/PIPL 不得跨境送原始碼"
