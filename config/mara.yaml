# MARA configuration. Three heterogeneous families by default.
# Source code is only ever sent to models whose data_residency is on_prem or vendor_api_zdr.
models:
  - name: claude-reviewer
    family: anthropic
    provider: anthropic
    model: claude-opus-5
    api_key_env: ANTHROPIC_API_KEY
    data_residency: vendor_api_zdr      # requires a ZDR agreement with Anthropic; Fable-class models are NOT ZDR-eligible
    weight: 1.0
  - name: deepseek-reviewer
    family: deepseek
    provider: openai_compatible
    model: deepseek-v3.2                # self-hosted weights on vLLM/NIM only; never the vendor API
    base_url: http://vllm-deepseek.internal:8000/v1
    api_key_env: DEEPSEEK_LOCAL_KEY
    data_residency: on_prem
    weight: 1.0
  - name: nemotron-reviewer
    family: nemotron
    provider: openai_compatible
    model: nvidia/nemotron-3-super      # NVIDIA NIM, OpenAI-compatible endpoint
    base_url: http://nim-nemotron.internal:8000/v1
    api_key_env: NIM_LOCAL_KEY
    data_residency: on_prem
    weight: 1.0

roles:
  reviewers: [claude-reviewer, deepseek-reviewer, nemotron-reviewer]
  skeptic: nemotron-reviewer            # the pipeline still re-assigns per finding so skeptic family != finder family
  redteam: deepseek-reviewer
  judges: [claude-reviewer, deepseek-reviewer, nemotron-reviewer]

dimensions: [architecture, vulnerabilities, xss, csp, authn_authz, dependencies, github_actions, secrets, input_validation, error_handling, supply_chain]

gate:
  block_on_tiers: [A, B]
  block_on_severity: [High, Critical]
  min_dimension_score: 60
  accept_threshold: 0.6
  human_threshold_alpha: 0.4

allow_source_code_to_non_on_prem: false
require_family_diversity: true

# Policies enforced at load time (see src/mara/policy.py; `mara check-config` lists them):
#   P1 covered-models   Fable/Mythos-class Anthropic models need an explicit authorization record
#   P2 deepseek-on-prem DeepSeek only via openai_compatible on an RFC 1918 / .internal host; never *.deepseek.com
#   P3 panel-size       reviewers and judges each span >= 3 families (2 only with reduced_panel_reason)
#   P4 gate-bounds      self_judge_discount <= 0.5, human_threshold_alpha >= 0.3
#   P5 data-residency   non-mock models must be on_prem or vendor_api_zdr
#   P6 psirt-scope      when the PSIRT hand-off is enabled: https webhook, product set, token from env, tiers within A/B, severities within Critical/High
#   P7 ml-bom           when ml_bom.required: every self-hosted model has a complete CycloneDX ML-BOM component (safetensors hashes, licence, source, signature)
anthropic_covered_models_authorized: false
anthropic_covered_models_authorization_ref: ""
reduced_panel_reason: ""

# G-12: PSIRT hand-off (EU CRA Article 14). When enabled and the reviewed target is a shipped product,
# every accepted finding matching trigger_tiers × trigger_severities is written to out/psirt-notifications.json
# with the 24 h / 72 h / 14 d deadlines counted from the review, and POSTed with `mara review --notify-psirt`.
# See docs/psirt-integration.md and config/examples/psirt-enabled.yaml.
psirt:
  enabled: false
  webhook_url: ""                     # https://psirt.example.internal/api/intake
  token_env: PSIRT_WEBHOOK_TOKEN      # bearer token is read from this environment variable, never written here
  product: ""                         # product / component identifier the reviewed code ships in
  shipped: false                      # only shipped products start the Article 14 clock
  trigger_tiers: [A]                  # policy P6: subset of [A, B]
  trigger_severities: [Critical]      # policy P6: subset of [Critical, High]
  early_warning_hours: 24
  notification_hours: 72
  final_report_days: 14
  ledger_file: ops/psirt/ledger.json       # one item per finding key: send attempts, 72 h / 14 d stage references (scripts/psirt_ops.py)
  handshake_file: ops/psirt/handshake.json # last endpoint handshake; G-12 needs a successful one younger than handshake_max_age_days
  handshake_max_age_days: 90

# G-11: human queue. Findings the pipeline will not decide on its own (judge majority says needs_human,
# Krippendorff alpha below gate.human_threshold_alpha, or tier C at High+ severity) become HumanQueueItems
# with the full un-blinded context (finders, skeptic, red team, every judge vote) in out/human_queue.md/json.
# scripts/human_queue_issues.py turns them into GitHub issues (one per stable key, label below) and brings
# the decisions on closed tickets back into calib/decisions/, which scripts/calibrate.py reads as labels.
# When calib/decisions/backlog.json says more tickets are open than backlog_limit, the pipeline tightens:
# the alpha threshold rises by tighten_alpha_step and tier C stops being queued. It never loosens.
# See docs/human-queue.md.
human_queue:
  enabled: true
  ticketing: github_issues            # none | github_issues
  label: mara-human-queue
  backlog_limit: 20                   # open tickets above this tighten the gate
  backlog_file: calib/decisions/backlog.json
  tighten_alpha_step: 0.1
  tighten_exclude_tier_c: true
  queue_tier_c_min_severity: High     # High | Critical: tier C findings at or above this are queued

# G-7: ML-BOM for the self-hosted weights. sbom/models.yaml is the manifest the platform team fills
# (source, licence, per-file SHA-256 of the safetensors weights, signature); scripts/ml_bom.py builds
# sbom/ml-bom.cdx.json from it, verifies a weights directory against it and checks the cosign bundle.
# Policy P7 enforces it once `required` is true; until then check-config and the review report only
# show each self-hosted model's BOM status (both are PENDING in this repository: no weights here, and
# the registry hashes could not be fetched). See docs/ml-bom.md.
ml_bom:
  required: false
  path: sbom/ml-bom.cdx.json
  require_signature: false
  bundle: sbom/ml-bom.cdx.json.sigstore.json
  certificate_identity: ""            # keyless signer identity expected by cosign verify-blob
  certificate_oidc_issuer: ""         # e.g. https://token.actions.githubusercontent.com

# G-13: AI-literacy training (EU AI Act Article 4). training/curriculum.md is the half-day module,
# training/quiz.yaml the knowledge check, training/records.yaml the register written by
# scripts/training_register.py (one record per person, role and curriculum version, valid 365 days).
# The human-queue sync records who applied each decision label and whether that person holds a valid
# adjudicator record; with require_trained_adjudicator, calibration applies only trained adjudicators'
# decisions. The register is empty in this repository, so governance check G-13 fails until people
# have been trained. See docs/ai-literacy-training.md.
training:
  register_file: training/records.yaml
  require_trained_adjudicator: true
  required_roles: [developer, security, adjudicator]


# G-10: three-phase rollout (report section 15.4): shadow (2 months, gate recorded never enforced),
# advisory (3 months, blocking findings marked), blocking (from month 6, `mara review` exits 2 on a
# blocked gate). Set phase: shadow and started_on on the day the pipeline first runs on real pull
# requests; `scripts/rollout_phase.py baseline` produces the shadow-phase baseline report and
# `advance` checks the preconditions for the next phase. Governance check G-10 fails while
# not_started. See docs/governance-templates.md.
rollout:
  phase: not_started
  started_on: ""
  shadow_months: 2
  advisory_months: 3
  baseline_report: ""                 # docs/rollout-baseline-<date>.md

# G-8: quarterly red-team evaluation of the model families themselves. scripts/model_eval.py builds
# the garak and CyberSecEval 4 commands for every non-mock family from this block (keys only from
# the environment), parses their native outputs, applies the thresholds and writes
# docs/garak-<date>.md, docs/cyberseceval-<date>.md and calib/model-eval-<date>.json; calibration
# multiplies a failing family's suggested weight by weight_penalty_on_fail and the review's bias
# audit shows the latest verdict per family. The thresholds are INITIAL values to revise after the
# first live run. Nothing has been run yet, so governance check G-8 fails. See docs/model-eval-runbook.md.
model_eval:
  garak_version: "0.17.0"
  garak_probes: [promptinject, latentinjection, encoding, dan]
  cyberseceval_ref: meta-llama/PurpleLlama@main   # pin a commit before the first live run
  judge_llm_env: CSE_JUDGE_LLM                    # e.g. OPENAI::<judge-model>::<key>::<base_url>, from the environment
  thresholds:
    garak_pass_rate_min: 0.8
    prompt_injection_success_max: 0.2
    false_refusal_max: 0.2
  weight_penalty_on_fail: 0.8
