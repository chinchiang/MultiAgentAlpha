# which environment variable a model's key is read from (mara.credentials.key_env) and the six places that ask it
focused:
- tests/test_credentials.py
mutations:
- name: an explicit api_key_env is ignored
  file: src/mara/credentials.py
  old: '    return api_key_env or VENDOR_KEY_ENV.get(provider)'
  new: '    return VENDOR_KEY_ENV.get(provider)'
- name: the vendor default beats an explicit api_key_env
  file: src/mara/credentials.py
  old: '    return api_key_env or VENDOR_KEY_ENV.get(provider)'
  new: '    return VENDOR_KEY_ENV.get(provider) or api_key_env'
- name: a provider without a default falls back to the Anthropic key
  file: src/mara/credentials.py
  old: '    return api_key_env or VENDOR_KEY_ENV.get(provider)'
  new: '    return api_key_env or VENDOR_KEY_ENV.get(provider, "ANTHROPIC_API_KEY")'
- name: the two vendor defaults swapped
  file: src/mara/credentials.py
  old: 'VENDOR_KEY_ENV = {"anthropic": "ANTHROPIC_API_KEY", "gemini": "GEMINI_API_KEY"}'
  new: 'VENDOR_KEY_ENV = {"anthropic": "GEMINI_API_KEY", "gemini": "ANTHROPIC_API_KEY"}'
- name: an empty api_key_env is a name
  file: src/mara/credentials.py
  old: '    return api_key_env or VENDOR_KEY_ENV.get(provider)'
  new: '    return VENDOR_KEY_ENV.get(provider) if api_key_env is None else api_key_env'
- name: gemini adapter ignores api_key_env
  file: src/mara/providers/gemini_provider.py
  old: key_env(spec.provider, spec.api_key_env) or ""
  new: key_env(spec.provider, None) or ""
- name: anthropic adapter ignores api_key_env
  file: src/mara/providers/anthropic_provider.py
  old: '        name = key_env(spec.provider, spec.api_key_env)'
  new: '        name = key_env(spec.provider, None)'
- name: self-hosted adapter asks as if it were anthropic
  file: src/mara/providers/openai_compatible.py
  old: '        name = key_env(spec.provider, spec.api_key_env)'
  new: '        name = key_env("anthropic", spec.api_key_env)'
- name: target_key_env asks as if anthropic
  file: src/mara/model_eval.py
  old: '    return key_env(target.provider, target.api_key_env) or ""'
  new: '    return key_env("anthropic", target.api_key_env) or ""'
- name: garak key mapping asks as if gemini
  file: src/mara/model_eval.py
  old: '        source = key_env(target.provider, target.api_key_env)'
  new: '        source = key_env("gemini", target.api_key_env)'
- name: garak anthropic mapping ignores api_key_env
  file: src/mara/model_eval.py
  old: 'env = {ANTHROPIC_KEY_ENV: f"${key_env(target.provider, target.api_key_env)}"}'
  new: 'env = {ANTHROPIC_KEY_ENV: f"${ANTHROPIC_KEY_ENV}"}'
- name: workbench ignores api_key_env
  file: src/mara/web/env.py
  old: '    name = key_env(m.provider, m.api_key_env)'
  new: '    name = key_env(m.provider, None)'
- name: workbench asks as if anthropic
  file: src/mara/web/env.py
  old: '    name = key_env(m.provider, m.api_key_env)'
  new: '    name = key_env("anthropic", m.api_key_env)'
