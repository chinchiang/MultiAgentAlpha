# the empty outputs in the garak report (mara.model_eval.render_garak_report, its helpers _empty_cell and _empty_reason, and
# evaluate_family): a column of their share and,
# for a family whose pass rate is missing for them, a line saying so (2026-11-11: the report said only `missing`)
focused:
- tests/test_model_eval.py
mutations:
- name: the family table has no column for the empty outputs
  file: src/mara/model_eval.py
  old: '    L += ["| 家族 | 模型 | 通過 / 評估數 | pass rate | 空輸出率 | 判定 |", "|---|---|---:|---:|---:|---|"]'
  new: '    L += ["| 家族 | 模型 | 通過 / 評估數 | pass rate | 判定 |", "|---|---|---:|---:|---|"]'
- name: the empty-output column shows the share of the outputs that have text
  file: src/mara/model_eval.py
  old: |2
                     f"| {_fmt(v.get('value'))} | {_empty_cell(g)} | {v.get('status', 'missing')} |")
  new: |2
                     f"| {_fmt(v.get('value'))} | {_percent(g.get('empty_rate') and 1 - g['empty_rate'])} | {v.get('status', 'missing')} |")
- name: the empty-output column shows the pass rate again
  file: src/mara/model_eval.py
  old: |2
                     f"| {_fmt(v.get('value'))} | {_empty_cell(g)} | {v.get('status', 'missing')} |")
  new: |2
                     f"| {_fmt(v.get('value'))} | {_percent(g.get('empty_rate') and v.get('value'))} | {v.get('status', 'missing')} |")
- name: a family over the limit is given no line saying why
  file: src/mara/model_eval.py
  old: |2
        why = [line for r in results for line in _empty_reason(r, "garak_pass_rate", "空輸出", "garak pass rate ")]
        L += ([""] + why) if why else []
  new: |2
        why = [line for r in results for line in _empty_reason(r, "garak_pass_rate", "空輸出", "garak pass rate ")]
        L += []
- name: a family missing for any reason is given the line
  file: src/mara/model_eval.py
  old: |2
        if "empty_rate" not in verdict:
            return []
        return [f"- {r.target.family}: {kind} {_percent(verdict['empty_rate'])}{detail}，"
  new: |2
        if verdict.get("status") != "missing":
            return []
        return [f"- {r.target.family}: {kind} {_percent(verdict.get('empty_rate'))}{detail}，"
- name: the line names the limit with a decimal
  file: src/mara/model_eval.py
  old: 'f"超過上限 {_percent(MAX_EMPTY_OUTPUT_RATE, 0)}，{what}不計入（missing）"]'
  new: 'f"超過上限 {_percent(MAX_EMPTY_OUTPUT_RATE, 1)}，{what}不計入（missing）"]'
- name: a family with nothing evaluated is not told that its outputs are empty
  file: src/mara/model_eval.py
  old: |2
            if garak and (garak.get("empty_rate") or 0) > MAX_EMPTY_OUTPUT_RATE:  # every output empty: nothing was evaluated
                out["garak_pass_rate"]["empty_rate"] = round(garak["empty_rate"], 4)
  new: ''
- name: a family at exactly the limit of empty outputs is missing
  file: src/mara/model_eval.py
  old: '    elif (garak.get("empty_rate") or 0) > MAX_EMPTY_OUTPUT_RATE:'
  new: '    elif (garak.get("empty_rate") or 0) >= MAX_EMPTY_OUTPUT_RATE:'
