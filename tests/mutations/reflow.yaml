focused: [tests/test_reflow.py]
# scripts/reflow.py rewraps the one paragraph of a Markdown file that holds a phrase, greedily at a width (#459). Each
# mutation breaks one rule its docstring states: what bounds the paragraph, a list item's hanging indent, the width, the
# words a unit holds, a refusal, or the file written.
mutations:
- name: a line of another indent is taken into the paragraph
  file: scripts/reflow.py
  caught_by: tests/test_reflow.py::test_a_line_of_another_indent_bounds_the_paragraph
  old: 'bool(ITEM.match(lines[k])) == item and _text_indent(lines[k]) == indent)'
  new: 'bool(ITEM.match(lines[k])) == item)'
- name: a blank line does not bound the paragraph
  file: scripts/reflow.py
  caught_by: tests/test_reflow.py::test_a_ragged_paragraph_is_rewrapped_greedily_at_the_width_and_the_lines_around_it_are_left
  old: '    return in_fence or not line.strip() or any('
  new: '    return in_fence or any('
