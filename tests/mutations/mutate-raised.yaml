focused: [tests/test_mutate.py::test_a_catch_that_ends_in_another_exception_than_an_assertion_error_says_where_it_was_raised, tests/test_mutate.py::test_an_exception_raised_outside_the_repository_is_placed_at_the_deepest_line_of_the_repository_that_led_to_it, tests/test_mutate.py::test_an_exception_raised_beside_the_repository_is_placed_at_the_deepest_line_of_the_repository_too, tests/test_mutate.py::test_an_exception_raised_in_the_repository_by_a_test_that_changed_directory_is_placed_there_too, tests/test_mutate.py::test_an_exception_raised_in_an_installed_package_under_the_root_is_placed_at_the_repository_s_line, tests/test_mutate.py::test_base_reprints_where_a_marked_catch_was_raised]
# a catch that ends in another exception than an AssertionError says where it was raised (#398): _failure reads the
# path:line of the traceback's deepest frame of the repository (under the root, not in site-packages), check keeps it as
# `raised` but for an AssertionError, the CAUGHT line prints it after `at:`, and --base reprints it on a marked line.
# Each mutation drops one of those. The six tests it means, not all of tests/test_mutate.py: the tests above them that
# read a whole CAUGHT line catch most of these first.
mutations:
  - name: raised is kept for an AssertionError
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_a_catch_that_ends_in_another_exception_than_an_assertion_error_says_where_it_was_raised
    old: '"raised": raised if error != "AssertionError" else None,'
    new: '"raised": raised,'
  - name: the CAUGHT line leaves raised out
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_a_catch_that_ends_in_another_exception_than_an_assertion_error_says_where_it_was_raised
    old: '(f"  raised: {r[''raised'']}" if r["raised"] else "")'
    new: '""'
  - name: raised is the shallowest frame
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_a_catch_that_ends_in_another_exception_than_an_assertion_error_says_where_it_was_raised
    old: 'frames[-1] if error and frames else None'
    new: 'frames[0] if error and frames else None'
  - name: raised drops the line number
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_a_catch_that_ends_in_another_exception_than_an_assertion_error_says_where_it_was_raised
    old: 'frames = [f"{path}:{m[2]}" for line'
    new: 'frames = [path for line'
  - name: raised is placed in the standard library, outside the repository
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_an_exception_raised_outside_the_repository_is_placed_at_the_deepest_line_of_the_repository_that_led_to_it
    old: "        except ValueError:\n            return None"
    new: "        except ValueError:\n            return path"
  - name: raised is placed beside the repository, from ..
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_an_exception_raised_beside_the_repository_is_placed_at_the_deepest_line_of_the_repository_too
    old: 'if p.parts[:1] == ("..",) or "site-packages" in p.parts:'
    new: 'if "site-packages" in p.parts:'
  - name: a frame printed absolute under the root is dropped
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_an_exception_raised_in_the_repository_by_a_test_that_changed_directory_is_placed_there_too
    old: '            p = p.relative_to(root.resolve())'
    new: '            return None'
  - name: raised is placed in an installed package under the root
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_an_exception_raised_in_an_installed_package_under_the_root_is_placed_at_the_repository_s_line
    old: ' or "site-packages" in p.parts:'
    new: ':'
  - name: the --base summary drops raised from a marked line
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_reprints_where_a_marked_catch_was_raised
    old: '                marked.append(line)'
    new: '                marked.append(line.replace(f"  raised: {r[''raised'']}", ""))'
