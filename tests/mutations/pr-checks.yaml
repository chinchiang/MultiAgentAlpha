focused:
- tests/test_pr_checks.py
mutations:
- name: the seeded fixture's semgrep step is read as the change's result line
  file: scripts/pr_checks.py
  old: scripts/semgrep_ci\.py --target \. "
  new: scripts/semgrep_ci\.py --target "
- name: a result line is read from the step's first line, not its last
  file: scripts/pr_checks.py
  old: for t in reversed(lines) if
  new: for t in lines if
- name: a result line no job log holds passes
  file: scripts/pr_checks.py
  old: "\"no result line in any job log\"))\n            bad += 1\n"
  new: '"no result line in any job log"))

    '
- name: fewer osv-scanner steps than CI runs pass
  file: scripts/pr_checks.py
  old: '        if len(found) < result.steps:

    '
  new: '        if not found:

    '
- name: a result line that is not clean passes
  file: scripts/pr_checks.py
  old: "                out.append(f\"     read the step: {step}\")\n                bad += 1\n"
  new: '                out.append(f"     read the step: {step}")

    '
- name: a result line that is not clean names no step to read
  file: scripts/pr_checks.py
  old: "                out.append(f\"     read the step: {step}\")\n                bad += 1\n"
  new: '                bad += 1

    '
- name: every skip counts as a tool not installed
  file: scripts/pr_checks.py
  old: TOOL_NOT_INSTALLED = (re.compile(r"\bnot installed\b"),)
  new: TOOL_NOT_INSTALLED = (re.compile(r""),)
- name: no skip counts as a tool not installed
  file: scripts/pr_checks.py
  old: TOOL_NOT_INSTALLED = (re.compile(r"\bnot installed\b"),)
  new: TOOL_NOT_INSTALLED = (re.compile(r"\bnot installed at all\b"),)
- name: a skip no missing tool explains passes
  file: scripts/pr_checks.py
  old: '*(f"  {line}" for line in other)], len(other)'
  new: '*(f"  {line}" for line in other)], 0'
- name: the skips counted are lines, not tests
  file: scripts/pr_checks.py
  old: sum(int(m[1]) for m in skips)
  new: len(skips)
- name: a failed check passes
  file: scripts/pr_checks.py
  old: bad = sum(check["bucket"] not in PASSING for check in checks) + len(unread)
  new: bad = len(unread)
- name: a job whose log cannot be read passes
  file: scripts/pr_checks.py
  old: bad = sum(check["bucket"] not in PASSING for check in checks) + len(unread)
  new: bad = sum(check["bucket"] not in PASSING for check in checks)
- name: a skipped check fails
  file: scripts/pr_checks.py
  old: PASSING = ("pass", "skipping")
  new: PASSING = ("pass",)
- name: a job whose log cannot be read stops everything
  file: scripts/pr_checks.py
  old: "                except subprocess.CalledProcessError as e:\n                    unread.append("
  new: "                except KeyError as e:\n                    unread.append("
- name: gh failing exits 1, as a check failing does
  file: scripts/pr_checks.py
  old: '        return 2

    '
  new: '        return 1

    '
- name: a required workflow that did not run passes
  file: scripts/pr_checks.py
  old: '        bad += bool(requiring)

    '
  new: '        bad += 0

    '
- name: a workflow that ran is listed as not run
  file: scripts/pr_checks.py
  old: pull_request_workflows(args.workflows) if name not in ran]
  new: pull_request_workflows(args.workflows)]
- name: it stops waiting at the first poll
  file: scripts/pr_checks.py
  old: "        if not pending:\n            return head, checks\n"
  new: "        if True:\n            return head, checks\n"
- name: a head that moved while it waited exits 0
  file: scripts/pr_checks.py
  old: "print(f\"ERROR: {waited}\", file=sys.stderr)\n            return 1\n"
  new: "print(f\"ERROR: {waited}\", file=sys.stderr)\n            return 0\n"
- name: a pull request with no check reported yet fails at once
  file: scripts/pr_checks.py
  old: 'if NO_CHECK_YET not in (e.stderr or ""):'
  new: 'if True:'
- name: an interrupted wait exits 1
  file: scripts/pr_checks.py
  old: '        return 130

    '
  new: '        return 1

    '
- name: a step that printed nothing is ok
  file: scripts/pr_checks.py
  old: ok = bool(line) and bool(result.clean.search(line))
  new: ok = not line or bool(result.clean.search(line))
- name: a job that installs the tools has its skips explained by a tool not installed
  file: scripts/pr_checks.py
  old: tools_missing = job not in TOOLS_INSTALLED
  new: tools_missing = True
- name: a pytest job that skips nothing prints no line
  file: scripts/pr_checks.py
  old: '([f"skips  [{job}]  0"] if any(runs(lines, PYTEST) for _, _, lines in log) else [])'
  new: '[]'
- name: a ruleset not enforced requires its checks
  file: scripts/pr_checks.py
  old: "        if ruleset.get(\"enforcement\") != \"active\":\n            continue\n"
  new: ""
- name: the head is not read again once no check is pending
  file: scripts/pr_checks.py
  old: "        now = head_of(gh, pr)\n        if now != head:\n            return f\"the head moved from {head} to {now}; run it again for the new head\"\n        if not pending:\n            return head, checks\n"
  new: "        if not pending:\n            return head, checks\n        now = head_of(gh, pr)\n        if now != head:\n            return f\"the head moved from {head} to {now}; run it again for the new head\"\n"
- name: a gh that cannot be started gives a traceback
  file: scripts/pr_checks.py
  old: "    except OSError as e:\n        raise subprocess.CalledProcessError(127"
  new: "    except KeyError as e:\n        raise subprocess.CalledProcessError(127"
