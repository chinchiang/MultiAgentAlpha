- name: a ruleset not enforced requires its checks
  file: scripts/pr_checks.py
  caught_by: tests/test_pr_checks.py::test_a_ruleset_not_enforced_requires_nothing
  old: "        if ruleset.get(\"enforcement\") != \"active\":\n            continue\n"
  new: ""
- name: the head is not read again once no check is pending
  file: scripts/pr_checks.py
  caught_by: tests/test_pr_checks.py::test_a_head_that_moved_before_the_checks_it_read_stops_it_with_exit_1
  old: "        now = head_of(gh, pr)\n        if now != head:\n            return f\"the head moved from {head} to {now}; run it again for the new head\"\n        if not pending:\n            return head, checks\n"
  new: "        if not pending:\n            return head, checks\n        now = head_of(gh, pr)\n        if now != head:\n            return f\"the head moved from {head} to {now}; run it again for the new head\"\n"
