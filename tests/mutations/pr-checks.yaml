  file: scripts/pr_checks.py
  caught_by: tests/test_pr_checks.py::test_a_skip_no_missing_tool_explains_is_printed_whole_and_exits_1
  old: '*(f"  {line}" for line in other)], len(other)'
  new: '*(f"  {line}" for line in other)], 0'
