focused: [tests/test_check_local.py]
mutations:
  - name: the osv checks run by default
    file: scripts/check_local.py
    old: 'for given in a.only or DEFAULT_CHECKS for'
    new: 'for given in a.only or CHECKS for'
  - name: --only osv runs one scan alone
    file: scripts/check_local.py
    old: 'GROUPS = {"osv": OSV_CHECKS}'
    new: 'GROUPS = {"osv": OSV_CHECKS[:1]}'
  - name: an osv check scans a lock CI does not
    file: scripts/check_local.py
    old: '"osv-semgrep": ("--lockfile", "tools/semgrep-requirements.txt",'
    new: '"osv-semgrep": ("--lockfile", "tools/semgrep-requirements.txt", "--lockfile", "tools/dev-requirements.txt",'
  - name: an osv report is written outside the logs
    file: scripts/check_local.py
    old: '"--report", str(a.logs / f"{name}.sarif")'
    new: '"--report", f"{name}.sarif"'
