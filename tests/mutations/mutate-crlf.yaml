focused: [tests/test_mutate.py]
mutations:
  - name: a mutation of several lines is not applied to a file with CRLF endings
    file: scripts/mutate.py
    old: '    if "\r\n" in text:'
    new: '    if False:'
  - name: a file with CRLF endings is restored with LF endings
    file: scripts/mutate.py
    old: '    mutant = text.replace(old, new).encode("utf-8")'
    new: "    mutant = text.replace(old, new).encode(\"utf-8\")\n    original = original.replace(b\"\\r\\n\", b\"\\n\")"
