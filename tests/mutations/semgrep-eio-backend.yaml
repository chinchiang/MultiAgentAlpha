# the Eio backend semgrep-core runs with (`scan_env` in src/mara/tools/semgrep_rules.py, for MARA's own scans and
# scripts/semgrep_ci.py alike): posix on Linux, for the Linux backend's io_uring rings fail now and then with "Cannot allocate
# memory"; elsewhere the backend its build chose
focused:
- tests/test_tool_env.py
mutations:
