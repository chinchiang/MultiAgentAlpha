focused: [tests/test_web_job_cancel.py]
mutations:
  - name: a stopped job is recorded by its exit code
    file: src/mara/web/jobs.py
    caught_by: tests/test_web_job_cancel.py::test_a_running_job_is_stopped_and_recorded_cancelled
    old: '        status = "timed_out" if timed_out else "cancelled" if stopped else "finished" if code == 0 else "failed"'
    new: '        status = "timed_out" if timed_out else "finished" if code == 0 else "failed"'
  - name: a job stopped by its timeout is recorded cancelled
    file: src/mara/web/jobs.py
    caught_by: tests/test_web_job_cancel.py::test_a_job_that_runs_past_its_timeout_is_stopped_and_recorded_timed_out
    old: '        status = "timed_out" if timed_out else "cancelled" if stopped else "finished" if code == 0 else "failed"'
    new: '        status = "cancelled" if stopped else "finished" if code == 0 else "failed"'
  - name: a job is never stopped by its timeout
    file: src/mara/web/jobs.py
    caught_by: tests/test_web_job_cancel.py::test_a_job_that_runs_past_its_timeout_is_stopped_and_recorded_timed_out
    old: '        timer.start()'
    new: '        pass'
  - name: a cancel of a job that is not running is answered as done
    file: src/mara/web/jobs.py
    caught_by: tests/test_web_job_cancel.py::test_a_job_that_is_not_running_cannot_be_cancelled
    error: Failed
    old: '        if not procs.ID_RE.match(job_id) or self.children.stop(job_id) != "stopped":'
