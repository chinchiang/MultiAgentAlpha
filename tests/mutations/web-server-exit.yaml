    file: src/mara/web/procs.py
    old: "        _stop_all([p for _, ps in taken for p in ps], grace)\n"
    new: "        for p in [p for _, ps in taken for p in ps]:\n            _stop_all([p], grace)\n"
  - name: a stop only kills, never terminates
    file: src/mara/web/procs.py
    old: "    for p in running:\n        terminate(p)\n"
