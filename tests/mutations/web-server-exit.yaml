# Equivalent, so not listed (the Spec reviewer's G2, G3, G8 on #166; scratch/design-web-stop-sequence.md):
# - G2, one KILL_WAIT_SECONDS deadline per child: SIGKILL takes effect at once, so the second wait never waits.
# - G3, no wait after the kill: ChildTable.shutdown() then joins every waiter, which waits for the exit anyway, and a
#   cancel's Children.stop() joins its waiter too.
# - G8, serve_forever() never clearing _serving: once serve_forever() returned, socketserver has set its
#   __is_shut_down, so close()'s second shutdown() returns at once.
