    file: src/mara/web/server.py
    old: "        if self._serving:\n            self.shutdown()\n"
    new: "        if True:\n            self.shutdown()\n"
  - name: close never shuts serving down
    file: src/mara/web/server.py
    old: "        if self._serving:\n            self.shutdown()\n"
    new: "        if False:\n            self.shutdown()\n"
  - name: close stops no child
    file: src/mara/web/server.py
    old: "        self.table.shutdown()\n        self.server_close()\n"
    new: "        self.server_close()\n"
  - name: close does not close the socket
    file: src/mara/web/server.py
    old: "        self.table.shutdown()\n        self.server_close()\n"
    new: "        self.table.shutdown()\n"
