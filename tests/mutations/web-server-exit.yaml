    new: "        waiters = [self._waiters[c] for c, p in self._procs.items() if p.poll() is None]\n"
  - name: the table stops the children inside the lock
    file: src/mara/web/procs.py
    old: "            taken = [children._taken_for_shutdown() for children in self._members]\n        _stop_all([p for _, ps in taken for p in ps], grace)\n"
    new: "            taken = [children._taken_for_shutdown() for children in self._members]\n            _stop_all([p for _, ps in taken for p in ps], grace)\n"
