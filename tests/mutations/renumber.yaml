focused: [tests/test_renumber.py]
mutations:
  - name: a stale REBASE_HEAD taken for a rebase in progress
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_collision_on_the_changelog_alone_takes_the_next_version_and_finishes_the_rebase
    old: '    return any(Path(_git("rev-parse", "--git-path", d).stdout.strip()).is_dir() for d in ("rebase-merge", "rebase-apply"))'
    new: '    return _git("rev-parse", "-q", "--verify", "REBASE_HEAD", check=False).returncode == 0'
  - name: more commits to apply not refused
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_rebase_with_more_commits_to_apply_is_refused
    old: '    if left := _commits_left():'
    new: '    if left := 0:'
  - name: a conflict in another file not refused
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_conflict_in_any_other_file_is_left_to_a_human
    old: '    if others := sorted(conflicted - {CHANGELOG, VERSION_FILE, DEMO}):'
    new: '    if others := []:'
  - name: a file that drifted in the rebase not refused
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_file_whose_changes_differ_after_the_rebase_is_reported_before_anything_changes
    old: '    if drifted := _drifted():'
    new: '    if drifted := []:'
  - name: the branch's row below main's
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_collision_on_the_changelog_alone_takes_the_next_version_and_finishes_the_rebase
    old: '    return text[:blocks[0].start()] + branch_row + main_rows + text[blocks[0].end():]'
    new: '    return text[:blocks[0].start()] + main_rows + branch_row + text[blocks[0].end():]'
  - name: the branch's row keeps its old version
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_collision_on_the_changelog_alone_takes_the_next_version_and_finishes_the_rebase
    old: '    branch_row = with_row_version(branch_rows, target)'
    new: '    branch_row = branch_rows'
  - name: the default not main's version plus one
    file: scripts/version_files.py
    caught_by: tests/test_renumber.py::test_a_collision_on_the_changelog_alone_takes_the_next_version_and_finishes_the_rebase
    old: '    return f"{major}.{minor}.{patch + 1}"'
    new: '    return f"{major}.{minor}.{patch + 2}"'
  - name: --to ignored
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_collision_on_the_version_and_the_demo_too_takes_the_version_asked_for
    old: '    target = target or next_version(_version(main_version_file))'
    new: '    target = next_version(_version(main_version_file))'
  - name: the conflicted demo not taken from main
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_collision_on_the_version_and_the_demo_too_takes_the_version_asked_for
    old: '        _git("checkout", "--ours", DEMO)'
    new: '        pass'
  - name: the commit message keeps the old version
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_collision_on_the_changelog_alone_takes_the_next_version_and_finishes_the_rebase
    old: '    if renamed != message:'
    new: '    if False:'
  - name: git's output read in the locale's encoding
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_branch_whose_files_hold_text_beyond_ascii_is_renumbered_whatever_the_locale
    old: 'capture_output=True, encoding="utf-8", check=check)'
    new: 'capture_output=True, text=True, check=check)'
  - name: the renamed message written in the locale's encoding
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_commit_message_beyond_ascii_is_written_back_as_utf8_whatever_the_locale
    old: 'input=renamed, encoding="utf-8", check=True)'
    new: 'input=renamed, text=True, check=True)'
  - name: an opening v<old> is left in the subject
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_a_version_commit_whose_subject_begins_with_its_version_is_renamed_there
    old: '    first = re.sub(rf"^v{re.escape(old)}:", f"v{new}:", first, count=1)'
    new: '    first = first'
  - name: a v<old> anywhere in the subject is renamed as if it opened it
    file: scripts/renumber.py
    caught_by: tests/test_renumber.py::test_the_subject_takes_the_new_version_where_it_opens_or_closes_it_and_nowhere_else
    old: 'rf"^v{re.escape(old)}:"'
    new: 'rf"v{re.escape(old)}:"'
