focused: [tests/test_mutate.py]
# scripts/mutate.py --base BASE runs, focused, every list lists_for names and sums them up (#339): run_base restores
# what a killed run left, loads every list first, runs each through run_mutation_list (the run a list given alone makes), and
# prints a summary; run_mutation_list gathers each list's marked catches, its catches with no `at:` and its LEFT lines. Each
# mutation drops one of those, or one refusal of main's.
mutations:
  - name: run_base restores nothing a killed run left
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_restores_what_a_killed_run_left_before_it_reads_the_change
    old: "    if why := restore_left(root, runs):  # first: a mutant a killed run left would read as part of the change\n        print(f\"ERROR: {why}\", file=sys.stderr)\n        return 2\n"
    new: ""
  - name: run_base reads the change before it restores what a killed run left
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_restores_what_a_killed_run_left_before_it_reads_the_change
    old: "    if why := restore_left(root, runs):  # first: a mutant a killed run left would read as part of the change\n        print(f\"ERROR: {why}\", file=sys.stderr)\n        return 2\n    try:\n        names = lists_for(base, root)\n    except ValueError as e:\n        print(f\"ERROR: {e}\", file=sys.stderr)\n        return 2\n"
    new: "    try:\n        names = lists_for(base, root)\n    except ValueError as e:\n        print(f\"ERROR: {e}\", file=sys.stderr)\n        return 2\n    if why := restore_left(root, runs):  # first: a mutant a killed run left would read as part of the change\n        print(f\"ERROR: {why}\", file=sys.stderr)\n        return 2\n"
  - name: a change that touches no list goes on to an empty summary
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_says_so_when_the_change_touches_no_list
    old: "    if not names:\n"
    new: "    if False:\n"
  - name: a list that does not load does not stop the run
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_refuses_a_list_that_does_not_load_before_any_file_is_touched
    old: "    if refused:\n        print(\"\\n\".join(refused), file=sys.stderr)\n        return 2\n"
    new: ""
  - name: a list with no focused tests is not refused
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_refuses_a_list_with_no_focused_tests_before_any_file_is_touched
    old: "        if not focused:\n            refused.append("
    new: "        if False:\n            refused.append("
  - name: each list runs with the whole suite as well
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_runs_each_list_the_change_touches_focused_and_sums_up_their_lines_and_marks
    old: "run_mutation_list(root / name, focused, mutations, root, runs, whole_suite=False)"
    new: "run_mutation_list(root / name, focused, mutations, root, runs, whole_suite=True)"
  - name: only the first list runs
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_runs_each_list_the_change_touches_focused_and_sums_up_their_lines_and_marks
    old: "    for name, focused, mutations, why in loaded:\n"
    new: "    for name, focused, mutations, why in loaded[:1]:\n"
  - name: a marked catch is not gathered
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_runs_each_list_the_change_touches_focused_and_sums_up_their_lines_and_marks
    old: "            if r[\"caught\"] and (r[\"error\"] not in (None, \"AssertionError\") or r[\"expected\"]):\n"
    new: "            if False:\n"
  - name: a catch with no at is not gathered
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_runs_each_list_the_change_touches_focused_and_sums_up_their_lines_and_marks
    old: "            if r[\"caught\"] and not r[\"at\"]:\n"
    new: "            if False:\n"
  - name: the left paths are not gathered
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_runs_each_list_the_change_touches_focused_and_sums_up_their_lines_and_marks
    old: "return MutationListRun(0 if caught == len(results) else 1, last, marked, unplaced, left_lines)"
    new: "return MutationListRun(0 if caught == len(results) else 1, last, marked, unplaced, [])"
  - name: a list that missed a mutation leaves the run's exit at 0
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_runs_each_list_the_change_touches_focused_and_sums_up_their_lines_and_marks
    old: "    return 2 if 2 in codes else 1 if 1 in codes else 0\n"
    new: "    return 2 if 2 in codes else 0\n"
  - name: a failed baseline is not the run's exit
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_goes_on_past_a_list_whose_baseline_fails_and_exits_2
    old: "    return 2 if 2 in codes else 1 if 1 in codes else 0\n"
    new: "    return 1 if 1 in codes else 0\n"
  - name: --only is taken beside --base
    file: scripts/mutate.py
    caught_by: tests/test_mutate.py::test_base_takes_no_list_and_neither_lists_for_nor_only_nor_focused_only
    old: "a.lists_for is not None or a.only or a.focused_only):"
    new: "a.lists_for is not None or a.focused_only):"
