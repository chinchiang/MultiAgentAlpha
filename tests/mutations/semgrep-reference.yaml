focused: [tests/test_semgrep_diff.py, tests/test_pr_checks.py]
# two semgrep SARIF files compared hit by hit (scripts/semgrep_diff.py), and the Reference run scripts/pr_checks.py
# prints under the pull request's semgrep line, with the hits the change adds and drops when the counts differ (#436),
# after the Change run (#451); each mutation breaks one
mutations:
- name: a rule id keeps the prefix of where the rules are installed
  file: scripts/semgrep_diff.py
  caught_by: tests/test_semgrep_diff.py::test_a_rule_named_with_the_prefix_of_where_the_rules_are_installed_is_the_same_rule
  old: '    return Counter((canonical_rule_id(rule), uri, line) for rule, uri, line in result_keys(doc))'
  new: '    return Counter((rule, uri, line) for rule, uri, line in result_keys(doc))'
- name: a hit a file holds twice counts once
  file: scripts/semgrep_diff.py
  caught_by: tests/test_semgrep_diff.py::test_a_hit_one_file_holds_and_the_other_does_not_is_named_once_on_its_side
  old: 'sorted((ha - hb).elements())'
  new: 'sorted(set(ha) - set(hb))'
- name: a hit only the second file holds is not printed
  file: scripts/semgrep_diff.py
  caught_by: tests/test_semgrep_diff.py::test_a_hit_one_file_holds_and_the_other_does_not_is_named_once_on_its_side
  old: '    out = [f"only in {b}: {rule}  {uri}:{line}" for rule, uri, line in c.only_b]'
  new: '    out = []'
