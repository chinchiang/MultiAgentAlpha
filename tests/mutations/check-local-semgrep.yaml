focused: [tests/test_check_local.py]
mutations:
  - name: semgrep left out of the default checks
    file: scripts/check_local.py
    old: 'DEFAULT_CHECKS = ("ruff", "lines", "mypy", "semgrep", "pytest", "gitleaks")'
    new: 'DEFAULT_CHECKS = ("ruff", "lines", "mypy", "pytest", "gitleaks")'
  - name: semgrep run after the suite
    file: scripts/check_local.py
    old: 'DEFAULT_CHECKS = ("ruff", "lines", "mypy", "semgrep", "pytest", "gitleaks")'
    new: 'DEFAULT_CHECKS = ("ruff", "lines", "mypy", "pytest", "semgrep", "gitleaks")'
  - name: semgrep against another triage file
    file: scripts/check_local.py
    old: '"--triage", "tools/semgrep-triage.yaml"], {}, None),'
    new: '"--triage", "tools/semgrep-triage.yml"], {}, None),'
  - name: semgrep's SARIF outside the logs
    file: scripts/check_local.py
    old: '                           str(a.logs / "semgrep.sarif"), "--triage"'
    new: '                           "semgrep.sarif", "--triage"'
  - name: semgrep scanning the seeded fixture instead of the repository
    file: scripts/check_local.py
    old: '"semgrep_ci.py"), "--target", ".", "--report",'
    new: '"semgrep_ci.py"), "--target", "fixtures/vuln-sample", "--report",'
