focused: [tests/test_sarif_shape.py]
# A file that is JSON but not shaped as SARIF (#344): shape_problem checks the type of each part the SARIF readers read
# into or take as text or a number, each reader asks it first and takes such a file as a report it cannot read, and a
# review takes it as a tool's scan that did not complete. Each mutation drops one of those checks or one of its limits
# (a result's first location, the nulls the readers take for absent), one reader's question, or one caller's catch in
# the tool runner. "scan_complete reads a document not shaped as SARIF" is caught by the AttributeError it raises on
# the first such document: the reading that fails is the fault.
mutations:
  - name: no document is found not shaped as SARIF
    file: src/mara/tools/sarif.py
    caught_by: tests/test_sarif_shape.py::test_a_document_not_shaped_as_sarif_has_no_error_notifications
    old: '    return shape.problems[0] if shape.problems else None'
    new: '    return None'
  - name: error_notifications reads a document not shaped as SARIF
    file: src/mara/tools/sarif.py
    caught_by: tests/test_sarif_shape.py::test_a_document_not_shaped_as_sarif_has_no_error_notifications
    old: "    if shape_problem(doc) is not None:\n        return []"
    new: "    if False:\n        return []"
  - name: scan_complete reads a document not shaped as SARIF
    file: src/mara/tools/sarif.py
    caught_by: tests/test_sarif_shape.py::test_a_document_not_shaped_as_sarif_is_a_scan_that_did_not_complete
