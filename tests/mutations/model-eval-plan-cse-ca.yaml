# the SSL_CERT_FILE in front of each CyberSecEval line `plan`, `run` and the reports show (`shell_line` in src/mara/model_eval.py):
# the invocation's own environment, as `run` gives it, and nothing when the family and the judge have no chain; never the
# process variables its keys are put back from, which reach the child through its environment (the line carries each key's
# KeyVariable.shown)
focused:
- tests/test_model_eval.py
mutations:
- name: a CyberSecEval line is shown without its CA file
  file: src/mara/model_eval.py
  old: '    environment = [(k, v if relative_to is None else _as_given(v, relative_to)) for k, v in inv.env.items()]'
  new: '    environment = [(k, v if relative_to is None else _as_given(v, relative_to)) for k, v in inv.env.items() if inv.tool == "garak"]'
- name: a CA file is shown before a line that has none
  file: src/mara/model_eval.py
  old: '    environment = [(k, v if relative_to is None else _as_given(v, relative_to)) for k, v in inv.env.items()]'
  new: '    environment = [(k, v if relative_to is None else _as_given(v, relative_to)) for k, v in inv.env.items()] or [("SSL_CERT_FILE", "ca.pem")]'
- name: another CA file is shown than the one run gives the command line
  file: src/mara/model_eval.py
  old: '    environment = [(k, v if relative_to is None else _as_given(v, relative_to)) for k, v in inv.env.items()]'
  new: '    environment = [(k, (v if relative_to is None else _as_given(v, relative_to)) + "x") for k, v in inv.env.items()]'
- name: a CyberSecEval line shows the process variables of its keys before it
  file: src/mara/model_eval.py
  old: '    in_argv = {name for name in inv.key_variables if any("{" + name + "}" in a for a in inv.argv)}'
  new: '    in_argv = set()'
