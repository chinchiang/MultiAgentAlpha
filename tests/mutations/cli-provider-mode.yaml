focused: [tests/test_cli_provider_mode.py]
# the provider mode checks are mutated in invocation.load, the command line's call of check_provider_mode, never in
# check_provider_mode or config_provider_mode: Pipeline.run calls those too, and a mutant without both checks runs a
# live review on a live config
mutations:
  - name: --provider a plain string again
    file: src/mara/cli.py
    old: '    provider: ProviderMode = typer.Option(ProviderMode.live, "--provider"),'
    new: '    provider: str = typer.Option("live", "--provider"),'
  - name: a third provider mode accepted
    file: src/mara/invocation.py
    old: "    live = \"live\"\n    mock = \"mock\"\n"
    new: "    live = \"live\"\n    mock = \"mock\"\n    foo = \"foo\"\n"
  - name: the live check removed
    file: src/mara/invocation.py
    old: '    check_provider_mode((m.provider for m in cfg.models), provider_mode)'
    new: '    check_provider_mode((m.provider for m in cfg.models), provider_mode) if provider_mode != "live" else None'
  - name: the live check without its hint
    file: src/mara/cli.py
    old: "    with _usage_errors():\n        cfg = load(cfg_path, inv.provider)\n"
    new: "    try:\n        cfg = load(cfg_path, inv.provider)\n    except InvocationError as e:\n        raise typer.BadParameter(str(e), param_hint=None if inv.provider == \"live\" else e.param) from e\n"
  - name: the mock check removed
    file: src/mara/invocation.py
    old: '    check_provider_mode((m.provider for m in cfg.models), provider_mode)'
    new: '    check_provider_mode((m.provider for m in cfg.models), provider_mode) if provider_mode != "mock" else None'
  - name: the mock check without its hint
    file: src/mara/cli.py
    old: "    with _usage_errors():\n        cfg = load(cfg_path, inv.provider)\n"
    new: "    try:\n        cfg = load(cfg_path, inv.provider)\n    except InvocationError as e:\n        raise typer.BadParameter(str(e), param_hint=None if inv.provider == \"mock\" else e.param) from e\n"
  - name: the live check refuses only an all-mock config
    file: src/mara/invocation.py
    old: '    check_provider_mode((m.provider for m in cfg.models), provider_mode)'
    new: '    check_provider_mode((m.provider for m in cfg.models), provider_mode) if provider_mode != "live" or all(m.provider == "mock" for m in cfg.models) else None'
  - name: every usage error of the review invocation without its option
    file: src/mara/cli.py
    old: '        raise typer.BadParameter(str(e), param_hint=e.param) from e'
    new: '        raise typer.BadParameter(str(e)) from e'
