    file: src/mara/schemas.py
    old: '    exploitable: Literal["yes", "conditional", "no", "unknown"]'
    new: '    exploitable: Literal["yes", "conditional", "no"]'
  - name: the judge's domain model lets the reason default though a reply requires it
    file: src/mara/schemas.py
    old: '    reason: str = Field(max_length=400)'
    new: '    reason: str = Field(default="", max_length=400)'
  - name: the skeptic's domain model requires sanitizer_or_control, so an older report no longer loads
    file: src/mara/schemas.py
    old: '    sanitizer_or_control: str = Field(default="", max_length=300)'
    new: '    sanitizer_or_control: str = Field(max_length=300)'
