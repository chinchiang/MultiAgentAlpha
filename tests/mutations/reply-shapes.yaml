    file: src/mara/agents/judge.py
    old: '        "type": "object", "additionalProperties": False, "required": ["finding_id", "verdict", "severity_band", "reason"],'
    new: '        "type": "object", "required": ["finding_id", "verdict", "severity_band", "reason"],'
