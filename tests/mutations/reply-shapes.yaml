focused: [tests/test_reply_shapes.py]
mutations:
  - name: the skeptic's schema admits a longer reason than its raw model
    file: src/mara/agents/skeptic.py
    old: '                       "reason": {"type": "string", "maxLength": 600},'
    new: '                       "reason": {"type": "string", "maxLength": 601},'
  - name: the judge's raw model allows a severity band its schema does not
    file: src/mara/agents/judge.py
    old: '    severity_band: Literal["None", "Low", "Medium", "High", "Critical"]'
    new: '    severity_band: Literal["None", "Info", "Low", "Medium", "High", "Critical"]'
  - name: the red team's schema no longer requires the preconditions its raw model does
    file: src/mara/agents/redteam.py
    old: '                "required": ["finding_id", "exploitable", "preconditions"],'
    new: '                "required": ["finding_id", "exploitable"],'
  - name: the judge's raw model parses a field its schema does not ask for
    file: src/mara/agents/judge.py
    old: "    reason: str = Field(max_length=400)\n\n\ndef run_judge("
    new: "    reason: str = Field(max_length=400)\n    confidence: float = 0.5\n\n\ndef run_judge("
