focused: [tests/test_mutate.py]
# a mutation's caught_by runs first, alone against the mutant (its alone run, scripts/mutate.py, #434 and #442): a
# failing alone run is the catch, where alone, its output the catch's, its log listed; one that catches nothing leaves
# the mutant to the focused tests and ends the mark with what it gave; a caught_by that fails alone without a mutation
# stops the run; each mutation breaks one
mutations:
- name: a caught_by that fails alone is not the catch
  file: scripts/mutate.py
  caught_by: tests/test_mutate.py::test_a_mutation_s_caught_by_runs_first_alone_so_an_earlier_test_of_its_file_does_not_catch_it_first
  old: '            if alone_code == 1:'
  new: '            if False:'
- name: the caught_by runs alone against the original, not the mutant
  file: scripts/mutate.py
  caught_by: tests/test_mutate.py::test_a_mutation_s_caught_by_runs_first_alone_so_an_earlier_test_of_its_file_does_not_catch_it_first
  old: '            alone_code, alone_by, alone_out = _pytest(root, [m["caught_by"]])'
  new: '            path.write_bytes(original); alone_code, alone_by, alone_out = _pytest(root, [m["caught_by"]]); path.write_bytes(mutant)'
- name: the alone run's log is not listed
  file: scripts/mutate.py
  caught_by: tests/test_mutate.py::test_a_catch_by_another_test_than_the_one_caught_by_names_is_marked_and_still_a_catch
  old: '            logs.append(f"{slug}.alone.log")'
  new: '            pass'
- name: a catch by the alone run is said to be the focused tests'
  file: scripts/mutate.py
  caught_by: tests/test_mutate.py::test_a_catch_by_another_test_than_the_one_caught_by_names_is_marked_and_still_a_catch
  old: '                code, by, where, out = 1, alone_by, "alone", alone_out'
  new: '                code, by, where, out = 1, alone_by, "focused", alone_out'
- name: a catch by the alone run reads where it failed from no output
  file: scripts/mutate.py
  caught_by: tests/test_mutate.py::test_a_catch_by_another_test_than_the_one_caught_by_names_is_marked_and_still_a_catch
  old: '                code, by, where, out = 1, alone_by, "alone", alone_out'
  new: '                code, by, where, out = 1, alone_by, "alone", out'
- name: an alone run pytest could not run is said to pass
  file: scripts/mutate.py
  caught_by: tests/test_mutate.py::test_a_catch_by_another_test_than_the_one_caught_by_names_is_marked_and_still_a_catch
  old: '("passes" if exit_code == 0 else'
  new: '("passes" if exit_code is not None else'
- name: no caught_by is run alone without a mutation
  file: scripts/mutate.py
  caught_by: tests/test_mutate.py::test_a_caught_by_that_fails_alone_without_a_mutation_stops_the_run_before_any_mutation
  old: '    for test in dict.fromkeys(caught_by):'
  new: '    for test in ():'
