    old: "    if \"\\x00\" in value:  # Path.resolve refuses a NUL byte on POSIX but lets it pass on Windows: the same answer on both\n        raise LaunchError(\"bad_path\", f\"{value[:200]!r}: not a usable path (a NUL byte)\")\n"
    new: ""
