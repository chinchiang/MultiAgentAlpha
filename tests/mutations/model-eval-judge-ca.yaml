# the SSL_CERT_FILE `model_eval.py` gives a family: the public roots, the target's chain and the CyberSecEval judge's chain
# (`_ca_bundle_pem`, `_tls` and `invocations` in src/mara/model_eval.py; `judge_ca_bundle` in config/mara.yaml). The judge
# runs in the process of the model under evaluation, so a family with no chain of its own needs it
focused:
- tests/test_model_eval.py
mutations:
- name: the bundle leaves the judge's chain out
  file: src/mara/model_eval.py
  old: '    for named in (target.ca_bundle, judge_ca_bundle):'
  new: '    for named in (target.ca_bundle,):'
- name: the bundle is made only when the target has a chain of its own
  file: src/mara/model_eval.py
  old: |2
        if not target.ca_bundle and not judge_ca_bundle:
            return None
  new: |2
        if not target.ca_bundle:
            return None
- name: the bundle lists the judge's chain before the target's
  file: src/mara/model_eval.py
  old: '    for named in (target.ca_bundle, judge_ca_bundle):'
  new: '    for named in (judge_ca_bundle, target.ca_bundle):'
- name: a chain named by both the target and the judge is listed twice
  file: src/mara/model_eval.py
  old: '        if named and (path := resolve_user_path(named)) not in paths:'
  new: '        if named and (path := resolve_user_path(named)):'
- name: a chain written with a tilde is looked for as a relative path
  file: src/mara/model_eval.py
  old: '        if named and (path := resolve_user_path(named)) not in paths:'
  new: '        if named and (path := Path(named)) not in paths:'
- name: the CA file of a family with a chain of its own is written without the judge's chain
  file: src/mara/model_eval.py
  old: 'ca_bundles=(target.ca_bundle, judge_ca_bundle)'
  new: 'ca_bundles=(target.ca_bundle, "" if target.ca_bundle else judge_ca_bundle)'
- name: plan and run give garak the CA file of the target only
  file: src/mara/model_eval.py
  old: |2
            env, files = _tls(t, out, settings.judge_ca_bundle)
            if (options := _garak_generator_options(t)) is not None:
  new: |2
            env, files = _tls(t, out, "")
            if (options := _garak_generator_options(t)) is not None:
- name: plan and run give CyberSecEval the CA file of the target only
  file: src/mara/model_eval.py
  old: |2-
            env, files = _tls(t, out, settings.judge_ca_bundle)
            for bench, argv in
  new: |2-
            env, files = _tls(t, out, "")
            for bench, argv in
- name: a family gets SSL_CERT_FILE only when it has a chain of its own
  file: src/mara/model_eval.py
  old: |2
        if not target.ca_bundle and not judge_ca_bundle:
            return {}, ()
  new: |2
        if not target.ca_bundle:
            return {}, ()
- name: the shipped config names no chain for the judge
  file: config/mara.yaml
  old: '  judge_ca_bundle: ~/.mara/inventec-ca.pem'
  new: '  judge_ca_bundle: ""'
