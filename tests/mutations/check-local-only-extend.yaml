focused: [tests/test_check_local.py]
mutations:
  - name: a repeated --only keeps the last
    file: scripts/check_local.py
    old: 'ap.add_argument("--only", action="extend", nargs="+",'
    new: 'ap.add_argument("--only", nargs="+",'
  - name: no --only runs no check
    file: scripts/check_local.py
    old: 'a.only = list(dict.fromkeys(a.only or CHECKS))'
    new: 'a.only = list(dict.fromkeys(a.only or []))'
  - name: a repeated check runs twice
    file: scripts/check_local.py
    old: 'a.only = list(dict.fromkeys(a.only or CHECKS))'
    new: 'a.only = list(a.only or CHECKS)'
