focused: [tests/test_line_width.py, tests/test_control_chars.py, tests/test_check_local.py]
mutations:
  - name: line_width --worktree reads the commits, not the working tree
    file: scripts/line_width.py
    old: 'base if a.worktree else f"{base}..{a.head}", "--", "*.py"]'
    new: 'f"{base}..{a.head}", "--", "*.py"]'
  - name: line_width --worktree reads no untracked file
    file: scripts/line_width.py
    old: 'untracked, untracked_not_utf8 = untracked_lines(git, a.repo, "*.py") if a.worktree else ([], [])'
    new: 'untracked, untracked_not_utf8 = [], []'
  - name: line_width --worktree reads untracked files that are not Python
    file: scripts/line_width.py
    old: 'untracked_lines(git, a.repo, "*.py")'
    new: 'untracked_lines(git, a.repo)'
  - name: an untracked file git ignores is read
    file: scripts/line_width.py
    old: '"ls-files", "--others", "--exclude-standard", "-z",'
    new: '"ls-files", "--others", "-z",'
  - name: control_chars --worktree reads the commits, not the working tree
    file: scripts/control_chars.py
    old: '"--dst-prefix=b/", base if a.worktree else f"{base}..{a.head}"]))'
    new: '"--dst-prefix=b/", f"{base}..{a.head}"]))'
  - name: control_chars --worktree reads no untracked file
    file: scripts/control_chars.py
    old: 'untracked, untracked_not_utf8 = untracked_lines(git, a.repo) if a.worktree else ([], [])'
    new: 'untracked, untracked_not_utf8 = [], []'
  - name: control_chars --worktree reads the commit messages
    file: scripts/control_chars.py
    old: 'log = "" if a.worktree else subprocess.run('
    new: 'log = subprocess.run('
  - name: the worktree group leaves ruff out
    file: scripts/check_local.py
    old: 'WORKTREE_CHECKS = ("ruff", "lines-worktree",'
    new: 'WORKTREE_CHECKS = ("lines-worktree",'
  - name: the worktree group runs the checks of the branch's commits
    file: scripts/check_local.py
    old: '"ruff", "lines-worktree", "chars-worktree", "pytest-worktree")'
    new: '"ruff", "lines", "chars", "pytest-worktree")'
  - name: the worktree group leaves pytest-worktree out
    file: scripts/check_local.py
    old: '"chars-worktree", "pytest-worktree")  #'
    new: '"chars-worktree")  #'
  - name: the summary pads every name to 8 columns
    file: scripts/check_local.py
    old: 'width = max(8, *map(len, a.only))'
    new: 'width = 8'
