focused: [tests/test_credential_guard.py]
# the credential guard of tests/conftest.py: the variables it removes, gh's login, the guard's gh first on PATH
# and what it says, the AWS chain's files and metadata lookup, its directory, and the list held to the
# variables of the credential sources; no mutation both puts the guard's gh off PATH and gives gh a login
mutations:
- name: a credential variable of the caller is left to the tests
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_test_sees_no_credential_the_caller_holds
  old: '        os.environ.pop(name, None)'
  new: '        pass'
- name: gh keeps the caller's login
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_test_sees_no_credential_the_caller_holds
  old: '    os.environ["GH_CONFIG_DIR"] = str(guard_dir / "gh-config")'
  new: '    pass'
- name: the guard's gh is not first on PATH
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_test_sees_no_credential_the_caller_holds
  old: '        os.environ["PATH"] = str(guard_dir / "bin") + os.pathsep + os.environ.get("PATH", "")'
  new: '        pass'
- name: the guard's gh succeeds
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_test_sees_no_credential_the_caller_holds
  old: exit 97\n
  new: exit 0\n
- name: the guard's gh does not say what was called
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_script_run_with_no_gh_of_its_own_meets_the_guards_gh
  old: 'the real gh: gh $*" >&2'
  new: the real gh" >&2
- name: the AWS chain reads the caller's credentials file
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_test_sees_no_credential_the_caller_holds
  old: '    os.environ["AWS_SHARED_CREDENTIALS_FILE"] = str(guard_dir / "aws" / "credentials")'
  new: '    pass'
- name: the AWS chain reads the caller's config file
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_test_sees_no_credential_the_caller_holds
  old: '    os.environ["AWS_CONFIG_FILE"] = str(guard_dir / "aws" / "config")'
  new: '    pass'
- name: the AWS chain reads the caller's boto config
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_test_sees_no_credential_the_caller_holds
  old: '    os.environ["BOTO_CONFIG"] = str(guard_dir / "boto")'
  new: '    pass'
- name: the AWS instance metadata lookup is left on
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_test_sees_no_credential_the_caller_holds
  old: '    os.environ["AWS_EC2_METADATA_DISABLED"] = "true"'
  new: '    pass'
- name: the guard's directory is left behind
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_test_sees_no_credential_the_caller_holds
  old: '        shutil.rmtree(guard_dir, ignore_errors=True)'
  new: '        pass'
- name: a key variable a config names is not removed
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_the_guard_removes_every_variable_of_the_credential_sources
  old: '"DEEPSEEK_LOCAL_KEY", "GLM_LOCAL_KEY", "NIM_LOCAL_KEY",'
  new: '"DEEPSEEK_LOCAL_KEY", "GLM_LOCAL_KEY",'
- name: a token variable of gh is not removed
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_a_test_sees_no_credential_the_caller_holds
  old: '"GH_TOKEN", "GITHUB_TOKEN", "GH_ENTERPRISE_TOKEN", "GITHUB_ENTERPRISE_TOKEN",'
  new: '"GITHUB_TOKEN", "GH_ENTERPRISE_TOKEN", "GITHUB_ENTERPRISE_TOKEN",'
- name: garak's key variable is not removed
  file: tests/conftest.py
  caught_by: tests/test_credential_guard.py::test_the_guard_removes_every_variable_of_the_credential_sources
  old: '"ANTHROPIC_API_KEY", "GEMINI_API_KEY", "OPENAICOMPATIBLE_API_KEY",'
  new: '"ANTHROPIC_API_KEY", "GEMINI_API_KEY",'
