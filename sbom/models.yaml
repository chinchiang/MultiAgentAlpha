# ML-BOM manifest (governance item G-7). One entry per self-hosted model the pipeline calls; the
# platform team fills it in and `python3 scripts/ml_bom.py build` turns it into the CycloneDX 1.6
# ML-BOM at sbom/ml-bom.cdx.json. See docs/ml-bom.md.
#
#   model_id      must equal the `model` field of the matching entry in config/mara.yaml
#   source        where the weights are downloaded from (official source only: huggingface | ngc | github)
#   license       SPDX id when one exists, else the licence name; url optional
#   format        safetensors only; pickle checkpoints (.bin/.pt/.pth/.pkl/.ckpt) are refused
#   signature     how the BOM is signed once complete (cosign-keyless | ngc), with the expected
#                 keyless identity / issuer and the Sigstore bundle path
#   files         per-file SHA-256 of the downloaded weights: run
#                   python3 scripts/ml_bom.py hash-dir /srv/models/<dir> --model-id <model_id> --write-manifest sbom/models.yaml
#                 on the download host, or paste the registry's sha256 values (Hugging Face LFS oid, NGC checksum).
#                 An empty list means PENDING: the BOM component is emitted without hashes, policy P7
#                 refuses it once ml_bom.required is true, and governance check G-7 fails naming it.
#
# Both production entries are PENDING in this repository: it does not host the weights, and the
# authoring environment could not reach huggingface.co or NGC to fetch registry hashes. Nothing
# below is a placeholder hash; hashes appear only once someone has computed them.
models:
  - model_id: deepseek-v3.2
    family: deepseek
    name: DeepSeek-V3.2
    version: "3.2"
    source:
      kind: huggingface
      url: https://huggingface.co/deepseek-ai/DeepSeek-V3.2
      revision: ""                     # pin the commit of the weights that were hashed
      vcs: https://github.com/deepseek-ai/DeepSeek-V3.2
    license:
      id: MIT
      url: https://github.com/deepseek-ai/DeepSeek-V3.2/blob/main/LICENSE
    format: safetensors
    serving: vllm
    architecture:
      family: DeepSeek-V3 mixture-of-experts with DeepSeek Sparse Attention
    signature:
      method: cosign-keyless
      identity: ""                     # e.g. platform-team@example.com or the CI workflow identity
      issuer: ""                       # e.g. https://token.actions.githubusercontent.com
      bundle: sbom/ml-bom.cdx.json.sigstore.json
    files: []
    note: >-
      PENDING. Weights must be downloaded from the official source only and loaded as safetensors;
      report Appendix B (A78): the formal source of the DeepSeek V4 weights could not be confirmed, so
      V3.2 is the only DeepSeek release with a verified source. Policy P2 keeps this model on-prem.

  - model_id: nvidia/nemotron-3-super
    family: nemotron
    name: NVIDIA Nemotron 3 Super
    version: "3"
    source:
      kind: ngc
      url: https://huggingface.co/nvidia
      revision: ""                     # exact repository name and commit to be confirmed by the platform team
    license:
      name: NVIDIA Open Model License
    format: safetensors
    serving: nim
    architecture:
      family: Nemotron 3 (hybrid Mamba-Transformer mixture-of-experts)
    signature:
      method: ngc                      # NGC signs models; keep the NGC signature check on the download host,
      identity: ""                     #   then sign the BOM with cosign as well
      issuer: ""
      bundle: sbom/ml-bom.cdx.json.sigstore.json
    files: []
    note: >-
      PENDING. The licence text and the exact NGC/Hugging Face repository were not read during the
      research (report Appendix B, B-gap-9); record them here together with the hashes.
