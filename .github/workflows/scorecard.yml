# OpenSSF Scorecard on the default branch, with the scorecard CLI pinned and SLSA-verified in
# tools/versions.lock rather than ossf/scorecard-action (a docker action whose image is referenced by a
# mutable tag, and whose result publishing needs id-token: write). scripts/scorecard_ci.py runs the CLI
# against this repository through the GitHub API, applies tools/scorecard-policy.yaml (an enforced check
# below its minimum fails the job), converts the JSON to SARIF and the last step uploads it to Code
# Scanning under the category "scorecard". Nothing is published to api.scorecard.dev. Same hardening as
# mara-review.yml: push/schedule/dispatch only, permissions: {} at the top, read-only job token plus
# security-events: write, every action pinned to a commit SHA, persist-credentials: false, no
# github.event.* interpolated into a run: line.
# While the repository is private the API job is skipped and the scorecard-local job below runs instead:
# the same locked CLI with --local on the committed tree (no token, no GitHub API), enforcing the same
# policy on the checks that are file-based (all six enforced ones are), with the JSON and SARIF kept as a
# workflow artifact only.
name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 2"   # Tuesdays 02:00 UTC, a day after the governance check
  workflow_dispatch:
concurrency:
  group: scorecard
  cancel-in-progress: false
permissions: {}

jobs:
  scorecard:
    name: OpenSSF Scorecard (locked CLI)
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19; bump deliberately after validating there
    timeout-minutes: 20
    # Skipped while the repository is private: the read-only GITHUB_TOKEN cannot run scorecard's GraphQL
    # queries on a private repository ("ListCommits: ... Resource not accessible by integration", runs of
    # 2026-09-21 and 2026-09-22), and Code Scanning there needs GitHub Advanced Security. Making the
    # repository public again re-enables the job and the policy in tools/scorecard-policy.yaml unchanged;
    # until then scorecard-local enforces the policy's file-based checks.
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write   # github/codeql-action/upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip   # wheels are re-verified by --require-hashes on every install, so a shared cache cannot substitute a pinned package
          cache-dependency-path: tools/*.txt
      - name: Install the locked scorecard (SLSA provenance verified with the locked slsa-verifier)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r tools/bootstrap-requirements.txt
          python3 scripts/install_tools.py --only slsa-verifier scorecard
          cat .mara-tools/manifest.json
      - name: Scorecard against this repository; an enforced check below tools/scorecard-policy.yaml fails the job
        # No --commit: scorecard analyses HEAD of the default branch, which on a push run is this commit.
        # Naming a SHA makes scorecard skip every check without commit-level support (Branch-Protection,
        # Maintained, SAST, Dependency-Update-Tool, Signed-Releases, ...): the first run on main only got 9.
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read-only is enough for a public repository
          REPO: ${{ github.repository }}
        run: python3 scripts/scorecard_ci.py --repo "github.com/$REPO" --json scorecard.json --sarif scorecard.sarif --policy tools/scorecard-policy.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scorecard
          path: |
            scorecard.json
            scorecard.sarif
          if-no-files-found: ignore
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        # not while the repository is private (Code Scanning needs Advanced Security there); the artifact above keeps the SARIF
        if: always() && hashFiles('scorecard.sarif') != '' && !github.event.repository.private
        with:
          sarif_file: scorecard.sarif
          category: scorecard
          wait-for-processing: true

  scorecard-local:
    name: OpenSSF Scorecard (locked CLI, local mode while private)
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19; bump deliberately after validating there
    timeout-minutes: 20
    # The complement of the job above: while private, scorecard --local needs neither a token nor the GitHub
    # API, so the enforced checks (Dangerous-Workflow, Token-Permissions, Binary-Artifacts, Pinned-
    # Dependencies, Security-Policy, Dependency-Update-Tool) keep failing the run on a regression. Checks
    # that need the API (Branch-Protection, Code-Review, Maintained, ...) are not run in this mode. No
    # security-events permission and no Code Scanning upload (it needs Advanced Security on a private
    # repository); the artifact keeps the SARIF.
    if: ${{ github.event.repository.private }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip   # wheels are re-verified by --require-hashes on every install, so a shared cache cannot substitute a pinned package
          cache-dependency-path: tools/*.txt
      - name: Install the locked scorecard (SLSA provenance verified with the locked slsa-verifier)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r tools/bootstrap-requirements.txt
          python3 scripts/install_tools.py --only slsa-verifier scorecard
          cat .mara-tools/manifest.json
      - name: Scorecard --local on the committed tree; an enforced check below tools/scorecard-policy.yaml fails the job
        # scorecard_ci.py exports HEAD with git archive first, so .mara-tools/bin (installed above, inside the
        # workspace) is not scanned as a checked-in binary.
        run: python3 scripts/scorecard_ci.py --local . --json scorecard.json --sarif scorecard.sarif --policy tools/scorecard-policy.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scorecard-local
          path: |
            scorecard.json
            scorecard.sarif
          if-no-files-found: ignore
