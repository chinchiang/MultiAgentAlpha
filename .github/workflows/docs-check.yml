# Report integrity check (Appendix E prompt 1, item 3): on every pull request and push to main,
# rebuild the report from docs/parts/ and require it to be byte-identical to the committed file,
# fail when the body (excluding Appendix A) is under 20,000 characters, and fail when any
# 【級別｜Xn】 marker cites a key that has no row in Appendix A.
# Same hardening as the other workflows: read-only permissions, every action pinned to a full SHA,
# no credentials persisted, no github.event.* interpolated into run: steps. The three scripts are
# standard-library only, so nothing is pip-installed here.
name: docs-check
on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/build_report.py"
      - "scripts/check_citations.py"
      - "scripts/count_words.py"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_report.py"
      - "scripts/check_citations.py"
      - "scripts/count_words.py"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}

jobs:
  docs-check:
    name: report build, word count, citations
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19; bump deliberately after validating there
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Rebuild the report from docs/parts and require it to be byte-identical
        run: |
          python3 scripts/build_report.py
          git diff --exit-code --stat -- docs/
      - name: Word count (fails under 20,000 characters, Appendix A excluded)
        run: python3 scripts/count_words.py
      - name: Citations (every 【…｜Xn】 marker must have a row in Appendix A)
        run: python3 scripts/check_citations.py
