# MARA self-review workflow.
# Hardening choices (all deliberate, see docs/ report, Part III and the github_actions reviewer prompt):
#   - trigger is pull_request, never pull_request_target (no pwn-request surface)
#   - permissions are declared per job and default to read-only
#   - every third-party action is pinned to a full commit SHA, not a tag
#   - deterministic tools run in their own job and hand SARIF to the model job; the model job never executes repo code
#   - no expression from github.event.* is interpolated into a run: step
#   - no continue-on-error on the L0 tools: a crashed scanner must be red, not green (the 2026-09-12 Actions
#     inventory found gitleaks-action had crashed with 403 on every PR while the job stayed green)
#   - secret scanning uses the gitleaks pinned and verified in tools/versions.lock (scripts/gitleaks_ci.py),
#     not gitleaks-action, which downloaded its own unverified copy and needed pull-requests: read + a token
#   - zizmor audits only the real workflows under .github/workflows; the seeded fixture workflow is audited in a
#     separate step whose findings must match the pre-recorded fixtures/vuln-sample-sarif/zizmor.sarif
#   - L0 tool binaries come only from tools/versions.lock via scripts/install_tools.py (SHA-256 + publisher
#     signature/provenance verified); nothing is taken from PATH or installed unpinned
#   - semgrep runs with the semgrep-rules checkout pinned in the lock (commit + content digest + GitHub's
#     web-flow commit signature), metrics off, never --config auto: nothing is sent to semgrep.dev. The
#     repository scan fails on any finding not triaged with a reason in tools/semgrep-triage.yaml, and the
#     seeded fixture must reproduce fixtures/vuln-sample-sarif/semgrep.sarif exactly
#   - osv-scanner checks the hash-locked closures under tools/ (package names and versions go to api.osv.dev,
#     never source code; --no-resolve, so nothing goes to deps.dev) and must flag the fixture's requests==2.19.0
#   - trivy runs only against a database fetched once by scripts/trivy_db.py (OCI digests, UpdatedAt and the
#     SHA-256 of trivy.db recorded; refused when stale or tampered) with every network path disabled; the
#     same flow (export/import a bundle) feeds runners without egress
#   - live model calls are NOT made in CI by default; the pipeline runs in mock mode unless MARA_LIVE=1 is set by a trusted branch
#   - the human-queue job (G-11) is the only job with a write scope, and only issues: write; it runs on push to
#     main, never on pull_request, and stays in --dry-run until the repository variable
#     MARA_HUMAN_QUEUE_ISSUES is set to "true"; it never commits (no contents: write), the decisions it syncs
#     are uploaded as an artifact and mirrored into calib/decisions/ by a person
name: mara-review
on:
  pull_request:
  push:
    branches: [main]
# One run per pull request: a newer push cancels the superseded run. Pushes to main queue instead of
# cancelling, so the human-queue job of an earlier merge is never skipped by a later one.
concurrency:
  group: mara-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}

jobs:
  deterministic-tools:
    name: L0 deterministic tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0      # gitleaks scans the change's commit range (base..head), so it needs the history
      - name: zizmor on the real workflows (any finding fails the job)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"   # tools/versions.lock pins semgrep's wheel hashes for CPython 3.11
      - name: Install pinned, verified L0 tools (tools/versions.lock)
        # SHA-256 for every asset, then the publisher's signature/provenance: cosign keyless (trivy, cosign),
        # SLSA provenance (osv-scanner, slsa-verifier), GitHub attestation via gh (zizmor), publisher
        # checksums (gitleaks), pip --require-hashes (semgrep), pinned commit + content digest + GPG commit
        # signature (semgrep-rules). Any failure fails the job. See docs/tools-provenance.md.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh attestation verify
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r tools/bootstrap-requirements.txt
          python3 scripts/install_tools.py
          cat .mara-tools/manifest.json
      - name: zizmor must trip on the seeded fixture exactly as pre-recorded
        run: |
          set +e
          (cd fixtures/vuln-sample && ../../.mara-tools/bin/zizmor --no-progress --offline --format sarif .) > fixture-zizmor.sarif
          echo "zizmor exit code on the fixture: $?"
          set -e
          python3 - <<'PY'
          import json
          def keyset(path):
              d = json.load(open(path, encoding="utf-8"))
              return sorted((r["ruleId"], r["locations"][0]["physicalLocation"]["region"]["startLine"])
                            for run in d["runs"] for r in run["results"])
          live, recorded = keyset("fixture-zizmor.sarif"), keyset("fixtures/vuln-sample-sarif/zizmor.sarif")
          print("live    :", live)
          print("recorded:", recorded)
          assert len(live) >= 4, "zizmor found fewer than 4 findings on the seeded fixture"
          assert live == recorded, "pre-recorded zizmor SARIF has drifted from what zizmor reports; regenerate it"
          PY
      - name: semgrep (locked CLI + pinned rules) must trip on the seeded fixture exactly as pre-recorded
        run: python3 scripts/semgrep_ci.py --target fixtures/vuln-sample --report fixture-semgrep.sarif --expect fixtures/vuln-sample-sarif/semgrep.sarif
      - name: semgrep on this repository; any finding not triaged in tools/semgrep-triage.yaml fails the job
        run: python3 scripts/semgrep_ci.py --target . --report semgrep.sarif --triage tools/semgrep-triage.yaml
      - name: osv-scanner must report the seeded fixture's known-vulnerable dependency (requests==2.19.0)
        run: python3 scripts/osv_ci.py --target fixtures/vuln-sample --report fixture-osv.sarif --expect-package requests
      - name: osv-scanner on the hash-locked closures this repository installs; any un-ignored advisory fails the job
        run: python3 scripts/osv_ci.py --lockfile tools/bootstrap-requirements.txt --lockfile tools/semgrep-requirements.txt --lockfile tools/model-eval-requirements.txt --config tools/osv-scanner.toml --report osv.sarif
      - name: trivy offline database — fetch once, record its digests, refuse a stale or tampered copy
        run: |
          python3 scripts/trivy_db.py download
          python3 scripts/trivy_db.py status
      - name: trivy (offline database) must report the seeded fixture's known-vulnerable dependency (requests==2.19.0)
        run: python3 scripts/trivy_ci.py --target fixtures/vuln-sample --report fixture-trivy.sarif --expect-package requests
      - name: trivy (offline database) on this repository; any finding not ignored in tools/trivyignore.yaml fails the job
        run: python3 scripts/trivy_ci.py --target . --report trivy.sarif --ignorefile tools/trivyignore.yaml --skip-dirs .mara-tools,fixtures,calib/samples,out
      - name: gitleaks (locked CLI) on this change's commits; crash or leak fails the job
        # PR: the PR's own commits base..head; push: every commit the push brought in. The SHAs reach the
        # script through env, never interpolated into the shell line. .gitleaks.toml / .gitleaksignore apply.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/gitleaks_ci.py --base "$BASE_SHA" --head "$HEAD_SHA" --event "$EVENT" --report gitleaks.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: l0-sarif
          path: |
            semgrep.sarif
            fixture-semgrep.sarif
            osv.sarif
            fixture-osv.sarif
            trivy.sarif
            fixture-trivy.sarif
            gitleaks.sarif
          if-no-files-found: ignore

  tests-and-mock-review:
    name: tests + mock review
    runs-on: ubuntu-latest
    needs: deterministic-tools
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit and end-to-end tests (mock providers, no network)
        run: pytest -q
      - name: Mock review of the seeded fixture (gate expected to block)
        run: |
          mara review fixtures/vuln-sample --provider mock --sarif-dir fixtures/vuln-sample-sarif --out out
          test -s out/report.sarif
      - name: ML-BOM validates against CycloneDX 1.6 and matches its manifest (G-7)
        run: python3 scripts/ml_bom.py validate --bom sbom/ml-bom.cdx.json --manifest sbom/models.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mara-report
          path: out/

  human-queue:
    name: human queue → tickets (G-11)
    runs-on: ubuntu-latest
    needs: tests-and-mock-review
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write     # gh issue create / gh label create; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r tools/bootstrap-requirements.txt
          python3 -m pip install --quiet -e .
      - name: Mock review of the seeded fixture (produces out/human_queue.json)
        run: mara review fixtures/vuln-sample --provider mock --sarif-dir fixtures/vuln-sample-sarif --out out
      - name: Open one ticket per queued finding and sync decisions from closed tickets
        # dry-run (prints the gh commands) until the repository variable MARA_HUMAN_QUEUE_ISSUES is "true".
        # The synced decisions land in calib/decisions/ on the runner and are uploaded below; this job has no
        # contents: write, so a person mirrors them into the repository (see docs/human-queue.md).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LIVE: ${{ vars.MARA_HUMAN_QUEUE_ISSUES }}
        run: |
          flag=--dry-run
          if [ "$LIVE" = "true" ]; then flag=""; fi
          python3 scripts/human_queue_issues.py --queue out/human_queue.json --repo "$REPO" --sync-decisions $flag
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mara-human-queue
          path: |
            out/human_queue.md
            out/human_queue.json
            calib/decisions/
