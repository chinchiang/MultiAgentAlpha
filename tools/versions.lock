# MARA L0 tool lock (Appendix E prompt 7, governance item G-5).
#
# Every deterministic tool the pipeline may execute is pinned here by exact version, download URL and
# SHA-256, plus the strongest verification the publisher offers. scripts/install_tools.py reads this
# file, downloads each asset, checks the SHA-256, runs the verification, and installs into
# .mara-tools/bin. Any mismatch aborts the whole install. src/mara/tools/runner.py executes tools only
# from .mara-tools/bin, never from PATH.
#
# Bumping a version: change version/url/sha256 here (compute the SHA-256 from the publisher's checksum
# file AND a fresh download; both are recorded), update docs/tools-provenance.md, and go through
# change management. The lock is the change record.
#
# Verification methods (see docs/tools-provenance.md for what each one does and does not prove):
#   sha256            always: the downloaded bytes must hash to `sha256` (pinned by us).
#   checksums-file    the publisher's checksum file must list the same SHA-256 for the asset.
#   cosign-keyless    Sigstore bundle verified with cosign (certificate identity + OIDC issuer).
#   slsa-provenance   SLSA v1 provenance (slsa-github-generator) verified with slsa-verifier.
#   github-attestation GitHub artifact attestation verified with `gh attestation verify`.
#   pip-hashes        pip --require-hashes over a fully hash-pinned requirements file.
schema: 1
platform:
  os: linux
  arch: x86_64
  python: "3.11"
install_dir: .mara-tools

# Verifiers are installed first and bootstrap trust: their SHA-256 is pinned here and cross-checked
# against the publisher's checksum file; once installed, each verifies its own release signature.
tools:
  cosign:
    role: verifier
    version: 3.1.3
    kind: binary
    homepage: https://github.com/sigstore/cosign
    license: Apache-2.0
    url: https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
    sha256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    publisher_checksums_url: https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign_checksums.txt
    verify:
      method: cosign-keyless
      bundle_url: https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64.sigstore.json
      certificate_identity_regexp: "^keyless@projectsigstore\\.iam\\.gserviceaccount\\.com$"
      oidc_issuer: https://accounts.google.com

  slsa-verifier:
    role: verifier
    version: 2.7.1
    kind: binary
    homepage: https://github.com/slsa-framework/slsa-verifier
    license: Apache-2.0
    url: https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/slsa-verifier-linux-amd64
    sha256: 946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339
    publisher_checksums_url: https://raw.githubusercontent.com/slsa-framework/slsa-verifier/main/SHA256SUM.md
    verify:
      method: slsa-provenance
      provenance_url: https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/slsa-verifier-linux-amd64.intoto.jsonl
      source_uri: github.com/slsa-framework/slsa-verifier
      source_tag: v2.7.1

  gitleaks:
    version: 8.30.1
    kind: archive
    extract: gitleaks
    homepage: https://github.com/gitleaks/gitleaks
    license: MIT
    url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
    sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    publisher_checksums_url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
    verify:
      method: checksums-file   # gitleaks releases carry no signature or attestation (2026-09-12)

  osv-scanner:
    version: 2.5.1
    kind: binary
    homepage: https://github.com/google/osv-scanner
    license: Apache-2.0
    url: https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
    sha256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
    publisher_checksums_url: https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_SHA256SUMS
    verify:
      method: slsa-provenance
      provenance_url: https://github.com/google/osv-scanner/releases/download/v2.5.1/multiple.intoto.jsonl
      source_uri: github.com/google/osv-scanner
      source_tag: v2.5.1

  zizmor:
    version: 1.30.1
    kind: archive
    extract: zizmor
    homepage: https://github.com/zizmorcore/zizmor
    license: MIT
    url: https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
    sha256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    verify:
      method: github-attestation   # release-binaries.yml uses actions/attest-build-provenance
      repo: zizmorcore/zizmor

  trivy:
    version: 0.74.0
    kind: archive
    extract: trivy
    homepage: https://github.com/aquasecurity/trivy
    license: Apache-2.0
    url: https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
    sha256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    publisher_checksums_url: https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_checksums.txt
    verify:
      method: cosign-keyless
      bundle_url: https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz.sigstore.json
      certificate_identity_regexp: "^https://github\\.com/aquasecurity/trivy/\\.github/workflows/reusable-release\\.yaml@refs/tags/v0\\.74\\.0$"
      oidc_issuer: https://token.actions.githubusercontent.com

  scorecard:
    version: 5.5.0
    kind: archive
    extract: scorecard
    homepage: https://github.com/ossf/scorecard
    license: Apache-2.0
    url: https://github.com/ossf/scorecard/releases/download/v5.5.0/scorecard_5.5.0_linux_amd64.tar.gz
    sha256: 83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff
    # no publisher checksum file on the release (2026-09-14); the SLSA provenance below lists the same sha256
    verify:
      method: slsa-provenance
      provenance_url: https://github.com/ossf/scorecard/releases/download/v5.5.0/multiple.intoto.jsonl
      source_uri: github.com/ossf/scorecard
      source_tag: v5.5.0

  semgrep:
    version: 1.177.0
    kind: pip
    homepage: https://github.com/semgrep/semgrep
    license: LGPL-2.1
    requirements: tools/semgrep-requirements.txt
    verify:
      method: pip-hashes   # PyPI publishes no PEP 740 provenance for semgrep (checked 2026-09-12)

  # Rules for semgrep. Not a binary: a checkout of semgrep/semgrep-rules at a pinned commit, from which only
  # the `paths` below (the security rulesets for the languages MARA reviews) are ever passed to semgrep.
  # The rules are licensed under the Semgrep Rules License v1.0 (not OSS): they are read at scan time from
  # .mara-tools/semgrep-rules and are never copied into this repository. `sha256` is the digest over every
  # file under `paths` (scripts/install_tools.py git_paths_digest), independent of git's SHA-1 naming.
  semgrep-rules:
    version: release@5a8a6be   # branch release, commit of 2026-07-27
    kind: git
    homepage: https://github.com/semgrep/semgrep-rules
    license: Semgrep Rules License v1.0 (https://semgrep.dev/legal/rules-license)
    url: https://github.com/semgrep/semgrep-rules.git
    commit: 5a8a6beafb1a848591f44bdddcb51584474493c4
    paths:
      - python/lang/security
      - python/flask/security
      - python/django/security
      - python/fastapi/security
      - python/requests/security
      - python/sqlalchemy/security
      - python/jwt/security
      - javascript/lang/security
      - javascript/express/security
      - javascript/jsonwebtoken/security
      - yaml/github-actions/security
      - generic/secrets/security
    sha256: 2e73e1c4693c439f44c68f2a0a1a85f67263a675dafa52655564d35ad7962b90
    verify:
      method: git-commit-gpg   # the release-branch merge commit is signed by GitHub's web-flow key
      gpg_key_url: https://github.com/web-flow.gpg
      gpg_key_id: B5690EEEBB952194
