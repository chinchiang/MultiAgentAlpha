# osv-scanner configuration for the semgrep tool closure (tools/semgrep-requirements.txt), scanned as its
# own scripts/osv_ci.py invocation. tools/osv-scanner.toml stays empty: the bootstrap, dev, typecheck and
# build closures must have no advisory exceptions at all. The semgrep closure is here because semgrep
# itself pins its dependencies: 1.177.0 (and the latest 1.178.0) declare pyjwt[crypto]~=2.13.0, so no
# fixed PyJWT release can enter the closure until upstream relaxes the pin. Every advisory that cannot be
# relocked away is listed with a reason and an expiry; the job fails again after ignoreUntil. Keep this
# list as short as possible: the fix is to bump semgrep and relock.
#
# PyJWT in this closure is used by semgrep for its own app-session token handling. The advisories concern
# PyJWKClient/JWKS fetching, key-confusion guards and token-parsing paths; the L0 job runs semgrep offline
# with local rules, --metrics=off and no authentication, so those paths are not exercised here. Re-check
# for a semgrep release that allows pyjwt>=2.14 before the expiry.

[[IgnoredVulns]]
id = "CVE-2026-101917"
ignoreUntil = 2026-12-31
reason = "PyJWKClient JWKS fetch amplification (incomplete fix of CVE-2026-48524); fixed in pyjwt 2.14.0, but semgrep 1.177.0/1.178.0 pin pyjwt[crypto]~=2.13.0 so the closure cannot take it. Re-check at a semgrep release that relaxes the pin."

