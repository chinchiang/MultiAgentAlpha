# Triage of csp-evaluator findings on this repository (scripts/csp_ci.py --triage). The L0 job fails
# on any finding not covered by an entry here; covered findings stay in the uploaded SARIF with a
# `suppressions` record carrying the reason. An entry that matches nothing is reported as stale so
# the list stays honest. `rule` is the csp-evaluator finding Type, `paths` are globs relative to
# the repository root.

accepted:
  - rule: SCRIPT_UNSAFE_INLINE
    paths: ["fixtures/vuln-sample/*"]
    reason: >
      Seeded, intentionally vulnerable review material (fixtures/vuln-sample): the weak CSP meta tag
      is what the CSP reviewer must find in calibration and what scripts/csp_ci.py --expect pins as
      the pre-recorded fixture SARIF. The repository's own pages ship hash-based, default-src 'none'
      policies generated by scripts/build_html.py and are not triaged.
  - rule: PLAIN_WILDCARD
    paths: ["fixtures/vuln-sample/*"]
    reason: >
      Same seeded fixture policy (default-src *); see the SCRIPT_UNSAFE_INLINE entry.
  - rule: SCRIPT_ALLOWLIST_BYPASS
    paths: ["fixtures/vuln-sample/*"]
    reason: >
      Same seeded fixture policy (a cdn.example-cdn.com script allowlist); see the
      SCRIPT_UNSAFE_INLINE entry.
  - rule: MISSING_DIRECTIVES
    paths: ["tests/test_tools_csp.py"]
    reason: >
      Test literals, not shipped code: the test file embeds minimal CSP strings (a script-src-only
      policy and the unparsable-policy marker) to exercise the extractor, the driver's exit codes
      and the parse-error notification. The findings are the expected output of those policies.
  - rule: SRC_HTTP
    paths: ["tests/test_tools_csp.py"]
    reason: >
      Same test file: the capacity and end-to-end tests embed an http:// source expression on
      purpose so the extractor has several distinct policy strings to work with.
