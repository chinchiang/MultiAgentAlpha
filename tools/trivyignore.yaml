# trivy ignore file for scripts/trivy_ci.py (--ignorefile). Same rule as tools/osv-scanner.toml: a finding
# on this repository that cannot be fixed by relocking yet is listed with a statement and an expiry; the
# job fails again after expired_at. Keep the lists empty whenever possible: the fix is to bump and relock.
#
# vulnerabilities:
#   - id: CVE-2026-00000
#     paths: ["tools/semgrep-requirements.txt"]
#     statement: "not reachable from semgrep's CLI use; tracked in issue #NN until the upstream fix is released"
#     expired_at: 2026-12-31
vulnerabilities:
  - id: CVE-2026-81726
    paths: ["tools/model-eval-requirements.txt"]
    statement: >-
      nltk 3.10.3 path traversal in model-artifact loading APIs. No fixed release exists (2026-09-17:
      3.10.3 is the newest and garak 0.17.0 requires >=3.10.3), so relocking cannot remove it. The
      closure is installed only on the isolated G-8 evaluation host (docs/model-eval-runbook.md), never
      in CI or the review pipeline. Re-check for a fixed nltk before the expiry.
    expired_at: 2026-12-17
  - id: CVE-2026-66007
    paths: ["tools/model-eval-requirements.txt"]
    statement: >-
      datasets 3.6.0 in the garak closure (osv-scanner reported it in CI on 2026-09-17; trivy's database
      did not carry it at the time). garak 0.17.0 pins datasets>=3.0.0,<4.0 and 3.6.0 is the newest 3.x
      release, so relocking cannot remove it without a garak upgrade. The closure is installed only on the
      isolated G-8 evaluation host, never in CI or the review pipeline. Re-check before the expiry.
    expired_at: 2026-12-17
  # PyJWT in the semgrep tool closure: semgrep 1.177.0 (latest 1.178.0) pins pyjwt[crypto]~=2.13.0, so no
  # fixed release (2.14.0+; CVE-2026-101918 in 2.15.0) can enter the closure. PyJWT there only serves
  # semgrep's own app-session token handling; the L0 job runs semgrep offline with local rules,
  # --metrics=off and no authentication, so the PyJWKClient/JWKS and token-parsing paths are not
  # exercised. Mirrors tools/osv-semgrep.toml; re-check for a semgrep release that relaxes the pin.
  - id: CVE-2026-101917
    paths: ["tools/semgrep-requirements.txt"]
    statement: "PyJWKClient JWKS fetch amplification; fixed in pyjwt 2.14.0 but semgrep pins pyjwt[crypto]~=2.13.0. See tools/osv-semgrep.toml."
    expired_at: 2026-12-31
  - id: CVE-2026-101918
    paths: ["tools/semgrep-requirements.txt"]
    statement: "RecursionError DoS in PyJWKClient pre-verification parse; fixed in pyjwt 2.15.0 but semgrep pins pyjwt[crypto]~=2.13.0. See tools/osv-semgrep.toml."
    expired_at: 2026-12-31
