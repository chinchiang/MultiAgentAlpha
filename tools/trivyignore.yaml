# trivy ignore file for scripts/trivy_ci.py (--ignorefile). Same rule as tools/osv-scanner.toml: a finding
# on this repository that cannot be fixed by relocking yet is listed with a statement and an expiry; the
# job fails again after expired_at. Keep the lists empty whenever possible: the fix is to bump and relock.
#
# vulnerabilities:
#   - id: CVE-2026-00000
#     paths: ["tools/semgrep-requirements.txt"]
#     statement: "not reachable from semgrep's CLI use; tracked in issue #NN until the upstream fix is released"
#     expired_at: 2026-12-31
vulnerabilities:
  - id: CVE-2026-104851
    paths: ["tools/model-eval-requirements.txt"]
    statement: >-
      fsspec 2025.3.0 in the garak closure (GHSA-27vj-qcqg-25rc, published 2026-10-02): template injection
      in ReferenceFileSystem, fixed in 2026.6.0. garak 0.17.0 (the newest release, checked 2026-10-06) pins
      datasets>=3.0.0,<4.0 and datasets 3.6.0 pins fsspec[http]<=2025.3.0, so relocking cannot reach the
      fix without a garak upgrade. Neither garak nor datasets opens reference:// filesystems on the
      evaluation path; the closure is installed only on the isolated G-8 evaluation host, never in CI or
      the review pipeline. Re-check before the expiry.
    expired_at: 2026-12-17
  - id: CVE-2026-66007
    paths: ["tools/model-eval-requirements.txt"]
    statement: >-
      datasets 3.6.0 in the garak closure (osv-scanner reported it in CI on 2026-09-17; trivy's database
      did not carry it at the time). garak 0.17.0 pins datasets>=3.0.0,<4.0 (re-checked 2026-10-03: garak
      0.17.0 is still the newest release and datasets 4.x/5.x exist but cannot enter the closure while the
      <4.0 pin stands), so relocking cannot remove it without a garak upgrade. The closure is installed only
      on the isolated G-8 evaluation host, never in CI or the review pipeline. Re-check before the expiry.
    expired_at: 2026-12-17
  # The thirteen PyJWT entries scoped to tools/semgrep-requirements.txt were removed on 2026-10-03:
  # semgrep 1.179.0 relaxed the pyjwt[crypto]~=2.13.0 pin, the closure relocked to pyjwt 2.15.1, and the
  # fixed releases (2.14.0 / 2.15.0) cover every advisory. See tools/osv-semgrep.toml.
  - id: CVE-2026-59951
    paths: ["tools/semgrep-requirements.txt"]
    statement: >-
      mcp 1.29.0 in the semgrep closure (GHSA-84m7-p3x7-pcfv, published 2026-10-14): unbounded session
      accumulation in the StreamableHTTP transport, fixed in mcp 1.30.0. semgrep 1.179.0 through 1.181.0
      (the newest release, checked 2026-10-16) pin mcp==1.29.0, so relocking cannot reach the fix. MARA runs
      semgrep scan only and never starts semgrep's MCP server. Mirrors tools/osv-semgrep.toml; re-check at
      a semgrep release that relaxes the pin.
    expired_at: 2026-12-31
  - id: CVE-2026-114603
    paths: ["tools/semgrep-requirements.txt"]
    statement: >-
      opentelemetry-api 1.37.0 in the semgrep closure (GHSA-xcq7-p3pf-p88h, published 2026-10-22): unbounded
      tracestate parsing, fixed in opentelemetry-api 1.45.1. semgrep 1.179.0 through 1.182.1 (the newest
      release, checked 2026-10-23) pin opentelemetry-api~=1.37.0, so relocking cannot reach the fix. semgrep
      extracts a trace context only under --trace and never from a tracestate; MARA runs semgrep scan without
      --trace and passes it no SEMGREP_* or OTEL_* variable. Mirrors tools/osv-semgrep.toml; re-check at a
      semgrep release that relaxes the pin.
    expired_at: 2026-12-31
  - id: CVE-2026-116684
    paths: ["tools/semgrep-requirements.txt"]
    statement: >-
      mcp 1.29.0 in the semgrep closure (GHSA-w4fh-qvv9-3v23, published 2026-10-27): server bearer-token authentication accepts a token issued for another
      resource server; fixed in mcp 1.30.0.
      semgrep 1.179.0 through 1.182.1 (the newest release, checked 2026-10-28) pin mcp==1.29.0, so
      relocking cannot reach the fix. Only semgrep mcp builds the auth settings and token verifier; MARA runs semgrep scan only. Mirrors tools/osv-semgrep.toml; re-check at a semgrep
      release that relaxes the pin.
    expired_at: 2026-12-31
  - id: CVE-2026-116685
    paths: ["tools/semgrep-requirements.txt"]
    statement: >-
      mcp 1.29.0 in the semgrep closure (GHSA-5h93-6whr-6q8j, published 2026-10-27): client HTTP transports follow cross-origin redirects carrying custom
      headers and bodies; fixed in mcp 1.30.0.
      semgrep 1.179.0 through 1.182.1 (the newest release, checked 2026-10-28) pin mcp==1.29.0, so
      relocking cannot reach the fix. semgrep contains no MCP client code, and MARA runs semgrep scan only. Mirrors tools/osv-semgrep.toml; re-check at a semgrep
      release that relaxes the pin.
    expired_at: 2026-12-31
  - id: CVE-2026-116686
    paths: ["tools/semgrep-requirements.txt"]
    statement: >-
      mcp 1.29.0 in the semgrep closure (GHSA-rwrf-2pqf-9j8j, published 2026-10-27): the client fetches server-chosen $ref URLs while validating tool output
      schemas; fixed in mcp 1.30.0.
      semgrep 1.179.0 through 1.182.1 (the newest release, checked 2026-10-28) pin mcp==1.29.0, so
      relocking cannot reach the fix. semgrep contains no MCP client code, and MARA runs semgrep scan only. Mirrors tools/osv-semgrep.toml; re-check at a semgrep
      release that relaxes the pin.
    expired_at: 2026-12-31
misconfigurations: []
