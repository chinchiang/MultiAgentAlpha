# osv-scanner configuration for scripts/osv_ci.py (the L0 job scans the hash-locked closures under tools/).
# An advisory that cannot be fixed by relocking yet is listed here with a reason and an expiry; the job
# fails again after ignoreUntil. Keep this list empty whenever possible: the fix is to bump and relock.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "not reachable from semgrep's CLI use; tracked in issue #NN until the upstream fix is released"

[[IgnoredVulns]]
id = "CVE-2026-104851"   # GHSA-27vj-qcqg-25rc; aliases (GHSA/PYSEC ids) match too: osv-scanner checks every alias of a group
ignoreUntil = 2026-12-17
reason = "fsspec 2025.3.0 in the garak closure (published 2026-10-02): template injection in ReferenceFileSystem (reference:// / Kerchunk documents rendered through jinja2), fixed in 2026.6.0. garak 0.17.0 (the newest release, checked 2026-10-06) pins datasets>=3.0.0,<4.0, and datasets 3.6.0 pins fsspec[http]<=2025.3.0, so relocking cannot reach the fix without a garak upgrade. Neither garak nor datasets opens reference:// filesystems on the evaluation path, and tools/model-eval-requirements.txt is installed only on the isolated G-8 evaluation host, never in CI or the review pipeline. Same entry in tools/trivyignore.yaml."

[[IgnoredVulns]]
id = "CVE-2026-66007"
ignoreUntil = 2026-12-17
reason = "datasets 3.6.0 in the garak closure (reported by osv-scanner in CI on 2026-09-17; trivy's database did not carry it). garak 0.17.0 pins datasets>=3.0.0,<4.0 (re-checked 2026-10-03: garak 0.17.0 is still the newest release; datasets 4.x/5.x exist but cannot enter the closure while the <4.0 pin stands), so relocking cannot remove it without a garak upgrade. tools/model-eval-requirements.txt is installed only on the isolated G-8 evaluation host, never in CI or the review pipeline. Same entry in tools/trivyignore.yaml."
