# Triage of semgrep findings on this repository (scripts/semgrep_ci.py --triage). The L0 job fails on any
# finding not covered by an entry here; covered findings stay in the uploaded SARIF with a `suppressions`
# record carrying the reason. An entry that matches nothing is reported as stale so the list stays honest.
# `rule` is the canonical semgrep rule id, `paths` are globs relative to the repository root.

# Directories passed to semgrep as --exclude for the repository scan: intentionally vulnerable review
# material, exercised through the pre-recorded SARIF (fixtures/vuln-sample-sarif) and the pipeline tests.
exclude:
  - fixtures
  - calib/samples

accepted:
  - rule: python.lang.security.audit.dangerous-subprocess-use-audit
    paths: ["scripts/*.py", "src/mara/tools/*.py", "tests/*.py"]
    reason: >
      Audit-only rule (LOW confidence) that fires on every subprocess call whose argv is not a literal.
      Every call in this repository passes an argv list (never shell=True); the executable is a tool
      installed from tools/versions.lock, git, gh, sys.executable or the node interpreter resolved from
      PATH, and the arguments are fixed flags plus values the caller validated. csp_eval.py feeds the
      serialized request to the pinned csp-evaluator driver over stdin and synthesizes CompletedProcess
      results when the driver or node is missing. Reviewed 2026-09-13 with the scan that introduced this
      file; csp_eval.py reviewed 2026-10-01 with the scan that introduced it.
  - rule: python.lang.security.audit.dangerous-subprocess-use-tainted-env-args
    paths: [scripts/calibration_run.py, scripts/gitleaks_ci.py, scripts/osv_ci.py, scripts/scorecard_ci.py, scripts/semgrep_ci.py, scripts/trivy_ci.py, scripts/zizmor_ci.py]
    reason: >
      The taint source is sys.argv, i.e. the operator's own command line; each value becomes one argv
      element of the pinned tool, no shell is involved. gitleaks_ci.py verifies --base/--head as commits
      with git rev-parse before they reach gitleaks; the workflow hands SHAs to these scripts through env,
      never by interpolating them into a shell line. trivy_ci.py passes --target, --ignorefile and
      --skip-dirs straight through as separate arguments of the locked trivy. zizmor_ci.py passes --target
      and --persona (a fixed choice list) to the locked zizmor; scorecard_ci.py passes --repo (checked
      against github.com/<owner>/<repo>), --commit and --checks to the locked scorecard.
  - rule: python.lang.security.audit.dangerous-subprocess-use-tainted-env-args
    paths: [src/mara/tools/runner.py]
    reason: >
      runner._run on Windows, when a tool is a script (WinError 193): the interpreter is MARA_WINDOWS_SH, which the
      operator sets explicitly (the test suite sets it for its shell-script fakes), and it runs only if it is an
      existing file. This replaced a lookup of `sh` on PATH (v0.5.5): an environment variable the operator names is
      the same trust as MARA_TOOLS_DIR, which already decides which binaries run; argv stays a list, no shell=True.
      Reviewed 2026-10-13 with the scan that introduced it.
  - rule: python.lang.security.audit.dangerous-subprocess-use-audit
    paths: ["src/mara/web/*.py"]
    reason: >
      The local workbench (mara serve, docs/adr/0006-local-web-workbench.md) starts children only as argv lists, never
      with shell=True: procs.spawn runs sys.executable with `-m mara.cli review|check-config` or one of the workspace's
      own scripts/install_tools.py and scripts/trivy_db.py, and the values a browser sends reach argv only after
      runs.RunRegistry.prepare / jobs.JobRegistry.argv validated them (resolved existing directories, a config under
      config/ or config/examples/, evidence inputs inside the workspace, the git ref matched against a fixed pattern
      and passed as one --base=<ref> argument, tool names from tools/versions.lock). env.node runs the node the
      csp-evaluator driver uses with --version only. Reviewed 2026-10-14 with the scan that introduced the package.
  - rule: generic.secrets.security.detected-stripe-api-key
    paths: [scripts/gen_calib_samples.py]
    reason: >
      The string is the seed the generator writes into calib/samples/s3-django-orders/settings.py: a fake
      sk_live_ key the secrets reviewer must find during calibration. calib/samples itself is excluded from
      this scan for the same reason. It is not a credential for any service.
  - rule: generic.secrets.security.detected-aws-secret-access-key
    paths: [tests/test_gitleaks_ci.py]
    reason: >
      AWS's own documentation example secret key, committed into a throwaway repository by the test so that
      the locked gitleaks demonstrably trips and redacts it. It is not a credential for any account.
  - rule: python.lang.security.audit.dynamic-urllib-use-detected
    paths: [scripts/advisory_facts.py, scripts/install_tools.py, scripts/trivy_db.py, src/mara/mlbom.py]
    reason: >
      install_tools.py: the URL is read from tools/versions.lock (https release URLs that go through change
      management; file:// only in tests) and every download is SHA-256-checked against the lock before use.
      trivy_db.py: the registry host and path come from tools/trivy-db.yaml (or an explicit --repository),
      the request is an https GET of an OCI manifest whose digests are only recorded for provenance; the
      artifact itself is fetched by the locked trivy, and a failed or odd response is recorded as unknown.
      mlbom.py (registry_files): the host is fixed to https://huggingface.co and the repository comes from
      the manifest's source.url after hf_repo_from_url refused anything else; the responses are the
      revision, the tree listing and small git-stored files that are hashed, never the weights.
      advisory_facts.py (fetch_json): run by hand; it refuses any URL outside https://api.osv.dev/v1/ and
      https://pypi.org/pypi/ before opening it (tested), the path is a package name from the lockfile, normalised by
      packaging, and a version from the lockfile or parsed by packaging, and the answers are read as JSON only.
      Reviewed 2026-10-29 with the scan that introduced the file.
  - rule: generic.secrets.security.detected-stripe-api-key
    paths: [".gitleaks.toml"]
    snippet_sha256: 90a49f6dfb4e862e9041cd3e0383488143a0537b6ca6099dc03724de68ab99c6
    reason: >
      Exact allowlist line for the pre-existing synthetic Stripe credential in the Django calibration
      fixture. The snippet hash binds this exception to that literal; changed values or other lines
      are not accepted. All fixture paths remain covered by gitleaks with exact-value exceptions.
